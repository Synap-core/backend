global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: synap-backend
    static_configs:
      - targets: ["backend:4000"]
    metrics_path: /metrics

  - job_name: synap-intelligence-service
    static_configs:
      - targets: ["${IS_HOST:-is}:3001"]
    metrics_path: /metrics
