# ==============================================================================
# Synap Backend — Standalone Docker Compose
# ==============================================================================
#
# Used by install.sh to deploy without cloning the source repository.
# All images pulled from GitHub Container Registry (ghcr.io/synap-core).
# No build fallbacks — images only.
#
# Differences from docker-compose.yml:
#   • No build: sections (images-only)
#   • Hardcoded GHCR image names (no ${GITHUB_REPOSITORY} variable)
#   • Config file paths relative to this file (./config/* instead of ../kratos/*)
#   • BACKEND_VERSION defaults to latest (pinnable via .env)
#
# Prerequisites:
#   • .env file in the same directory as this file (generated by install.sh)
#   • ./config/kratos/ with kratos.yml + identity.schema.json (generated by install.sh)
#   • ./config/postgres/init-databases.sh (downloaded by install.sh)
#   • ./Caddyfile (downloaded by install.sh)
#
# Quick reference:
#   docker compose pull                   # pull latest images
#   docker compose up -d                  # start all services
#   docker compose logs -f backend        # tail backend logs
#   docker compose down                   # stop (data persists in volumes)
#   docker compose down -v                # stop + DESTROY all data
# ==============================================================================

services:
  # ============================================================================
  # BACKEND API
  # ============================================================================
  backend:
    image: ghcr.io/synap-core/backend:${BACKEND_VERSION:-latest}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://synap:${POSTGRES_PASSWORD}@postgres:5432/synap
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      PROVISIONING_TOKEN: ${PROVISIONING_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      KRATOS_SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE}
      KRATOS_SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER}
      KRATOS_WEBHOOK_SECRET: ${KRATOS_WEBHOOK_SECRET}
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: synap-storage
      MINIO_USE_SSL: false
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_ADMIN_API_KEY: ${TYPESENSE_ADMIN_API_KEY}
      INTELLIGENCE_HUB_URL: ${INTELLIGENCE_HUB_URL:-}
      INTELLIGENCE_HUB_API_KEY: ${INTELLIGENCE_HUB_API_KEY:-}
      HUB_PROTOCOL_API_KEY: ${HUB_PROTOCOL_API_KEY:-}
      # Service credential encryption — REQUIRED for CP provisioning (register-intelligence).
      # Generated by install.sh. Rotating this key invalidates stored IS credentials.
      SYNAP_SERVICE_ENCRYPTION_KEY: ${SYNAP_SERVICE_ENCRYPTION_KEY}
      # Secrets vault — for add-on provisioning (OpenClaw, ZeroClaw bootstrap credentials)
      VAULT_SERVER_KEY: ${VAULT_SERVER_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://backend:4000}
      # Control Plane Integration (optional for self-hosted; required for SaaS pods)
      # Pods fetch /.well-known/jwks.json from CONTROL_PLANE_URL to verify ES256 JWTs.
      # No shared secret required — only the public JWKS endpoint is needed.
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      ORY_HYDRA_SECRETS_SYSTEM: ${ORY_HYDRA_SECRETS_SYSTEM}
      REALTIME_URL: http://realtime:4001
      HUB_JWT_SECRET: ${HUB_JWT_SECRET:-}
      # RSS Feed Provider Configuration
      RSS_PROVIDER_TYPE: ${RSS_PROVIDER_TYPE:-cpproxy}
      RSSHUB_URL: ${RSSHUB_URL:-http://rsshub:1200}
      RSSHUB_ACCESS_KEY: ${RSSHUB_ACCESS_KEY:-}
      CP_RSSHUB_PROXY_URL: ${CP_RSSHUB_PROXY_URL:-}
      RSS_FETCH_TIMEOUT_MS: ${RSS_FETCH_TIMEOUT_MS:-30000}
      RSS_FETCH_RETRIES: ${RSS_FETCH_RETRIES:-3}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - synap-net

  # ============================================================================
  # REALTIME SERVER (WebSocket / Socket.IO)
  # ============================================================================
  realtime:
    image: ghcr.io/synap-core/backend-realtime:${BACKEND_VERSION:-latest}
    restart: always
    environment:
      NODE_ENV: production
      REALTIME_PORT: 4001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATABASE_URL: postgresql://synap:${POSTGRES_PASSWORD}@postgres:5432/synap
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: synap-storage
      MINIO_USE_SSL: false
    command: node dist/server.js
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4001/bridge/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - synap-net
    dns:
      - 127.0.0.11

  # ============================================================================
  # DATABASE MIGRATIONS (one-shot)
  # ============================================================================
  backend-migrate:
    image: ghcr.io/synap-core/backend:${BACKEND_VERSION:-latest}
    environment:
      DATABASE_URL: postgresql://synap:${POSTGRES_PASSWORD}@postgres:5432/synap
      HUB_PROTOCOL_API_KEY: ${HUB_PROTOCOL_API_KEY:-}
      HUB_PROTOCOL_API_KEYS: ${HUB_PROTOCOL_API_KEYS:-}
      NODE_ENV: production
    command: >
      sh -c "node -e \"const fs=require('fs');const file='/app/migrations-drizzle/0000_broad_mathemanic.sql';if(fs.existsSync(file)){fs.writeFileSync(file,'-- patched: stale baseline disabled\\n');console.log('Patched stale migration:',file);}else{console.log('No stale migration to patch');}\" &&
             node node_modules/@synap/database/dist/scripts/migrate.js &&
             node node_modules/@synap/database/dist/scripts/init-hub-keys.js"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synap-net

  # ============================================================================
  # POSTGRESQL (TimescaleDB)
  # ============================================================================
  postgres:
    image: timescale/timescaledb-ha:pg15
    restart: always
    environment:
      POSTGRES_USER: synap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synap
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    networks:
      - synap-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - synap-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # MINIO (Object Storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - synap-net
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================================
  # TYPESENSE (Full-text search)
  # ============================================================================
  typesense:
    image: typesense/typesense:0.25.2
    restart: always
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_ADMIN_API_KEY}
      --search-only-api-key=${TYPESENSE_API_KEY}
      --enable-cors
    volumes:
      - typesense_data:/data
    networks:
      - synap-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8108' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # ORY KRATOS (Authentication)
  # ============================================================================
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synap-net

  kratos:
    image: oryd/kratos:v1.3.1
    restart: always
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER}
      SERVE_PUBLIC_BASE_URL: https://${DOMAIN}/.ory/kratos/public/
      SERVE_ADMIN_BASE_URL: http://kratos:4434
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN}/
      IDENTITY_SCHEMAS_0_ID: default
      IDENTITY_SCHEMAS_0_URL: file:///etc/config/kratos/identity.schema.json
      DOMAIN: ${DOMAIN}
      KRATOS_WEBHOOK_SECRET: ${KRATOS_WEBHOOK_SECRET}
      COURIER_SMTP_CONNECTION_URI: ${SMTP_CONNECTION_URI:-smtp://localhost:1025/}
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml", "--watch-courier"]
    volumes:
      - ./config/kratos:/etc/config/kratos
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "4433:4433"
      - "4434:4434"
    networks:
      - synap-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:4433/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # ORY HYDRA (OAuth2)
  # ============================================================================
  hydra-migrate:
    image: oryd/hydra:v2.3.0
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
    command: migrate sql up -e --yes
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synap-net

  hydra:
    image: oryd/hydra:v2.3.0
    restart: always
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: https://${DOMAIN}
      URLS_CONSENT: https://${DOMAIN}/consent
      URLS_LOGIN: https://${DOMAIN}/login
      SECRETS_SYSTEM: ${ORY_HYDRA_SECRETS_SYSTEM}
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - synap-net
    ports:
      - "4444:4444"
      - "4445:4445"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:4445/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # CADDY (Reverse Proxy + Automatic SSL)
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Auth snippet for the OpenClaw dashboard subdomain.
      # Generated by `synap openclaw setup-domain` — defaults to a 503 stub.
      - ./openclaw_auth.snippet:/etc/caddy/openclaw_auth.snippet:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${LETSENCRYPT_EMAIL}
      # Optional: expose OpenClaw dashboard via a public subdomain.
      # Set to e.g. openclaw.your-domain.com and add a DNS A record pointing to this server.
      # Leave unset to disable the OpenClaw subdomain entirely.
      OPENCLAW_DOMAIN: ${OPENCLAW_DOMAIN:-disabled.invalid}
    networks:
      - synap-net
    depends_on:
      backend:
        condition: service_started
      realtime:
        condition: service_started
    dns:
      - 127.0.0.11
      - 1.1.1.1
      - 8.8.8.8

  # ============================================================================
  # OPENCLAW (opt-in via profile)
  #
  # World-interface agent: shell, filesystem, browser automation, messaging
  # channels (Telegram, WhatsApp, Slack, Discord, iMessage, Teams...).
  #
  # Setup:
  #   1. Run ./setup-openclaw.sh to create agent credentials automatically
  #   2. Or manually: set OPENCLAW_HUB_API_KEY, SYNAP_WORKSPACE_ID in .env
  #
  # Start:
  #   docker compose --profile openclaw up -d openclaw
  # ============================================================================
  openclaw:
    container_name: openclaw
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    volumes:
      - openclaw_config:/root/.openclaw
      - openclaw_workspace:/root/openclaw/workspace
    environment:
      - SYNAP_POD_URL=${SYNAP_POD_URL:-http://backend:4000}
      - SYNAP_HUB_API_KEY=${OPENCLAW_HUB_API_KEY}
      - SYNAP_AGENT_USER_ID=${SYNAP_AGENT_USER_ID}
      - SYNAP_WORKSPACE_ID=${SYNAP_WORKSPACE_ID}
      - OPENCLAW_MODEL=${OPENCLAW_MODEL:-anthropic/claude-sonnet-4-6}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "18789:18789"
    networks:
      - synap-net
    profiles:
      - openclaw

  # ============================================================================
  # POD AGENT
  #
  # Remote management agent — receives signed commands from the Control Plane
  # to update config, deploy profiles, and manage addons.
  #
  # Listens on port 4002 (internal only — not exposed externally).
  # Reachable within the Docker network and via Caddy if a proxy rule is added.
  # ============================================================================
  pod-agent:
    image: ghcr.io/synap-core/pod-agent:${BACKEND_VERSION:-latest}
    restart: always
    environment:
      POD_AGENT_PORT: 4002
      DEPLOY_DIR: /deploy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy:rw
    networks:
      - synap-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # RSSHUB — Optional RSS aggregation service
  # Start with: docker compose --profile rsshub up -d
  # ============================================================================
  rsshub:
    image: diygod/rsshub:latest
    container_name: synap-rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=redis
      - REDIS_URL=redis://redis:6379
      - PUPPETEER_WS_ENDPOINT=ws://browserless:3000
      - ACCESS_KEY=${RSSHUB_ACCESS_KEY:-}
    depends_on:
      - redis
      - browserless
    profiles:
      - rsshub
    networks:
      - synap-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1200/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # BROWSERLESS — Chrome headless for RSSHub Puppeteer support
  # ============================================================================
  browserless:
    image: browserless/chrome:latest
    container_name: synap-browserless
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
      - MAX_QUEUE_LENGTH=20
    profiles:
      - rsshub
    networks:
      - synap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # MONITORING — Dozzle log viewer (optional)
  # Enable with: docker compose --profile monitoring up -d dozzle
  # ============================================================================
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    networks:
      - synap-net
    profiles:
      - monitoring

  # ============================================================================
  # PROMETHEUS — Metrics scraping + alerting rules
  # Enable with: docker compose --profile monitoring up -d
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    networks:
      - synap-net
    restart: unless-stopped

  # ============================================================================
  # GRAFANA — Metrics dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    profiles: ["monitoring"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/synap.json:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3333:3000"
    networks:
      - synap-net
    depends_on: [prometheus]
    restart: unless-stopped

  # ============================================================================
  # ALERTMANAGER — Alert routing (Slack, PagerDuty, etc.)
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - synap-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  typesense_data:
  caddy_data:
  caddy_config:
  openclaw_config:
  openclaw_workspace:
  prometheus-data:
  grafana-data:

networks:
  synap-net:
    driver: bridge
