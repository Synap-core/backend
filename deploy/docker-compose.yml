services:
  # ============================================================================
  # BACKEND API
  # ============================================================================
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-synap-core/backend}:${BACKEND_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://synap:${POSTGRES_PASSWORD}@postgres:5432/synap
      ADMIN_EMAIL: ${ADMIN_EMAIL:-} # For self-hosted: admin email
      PROVISIONING_TOKEN: ${PROVISIONING_TOKEN:-} # For control-plane-provisioned: one-time token for admin invitation
      CONTROL_PLANE_JWT_SECRET: ${CONTROL_PLANE_JWT_SECRET:-} # Shared secret with Synap Control Plane
      JWT_SECRET: ${JWT_SECRET}
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      KRATOS_SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE}
      KRATOS_SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER}
      KRATOS_WEBHOOK_SECRET: ${KRATOS_WEBHOOK_SECRET}
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: synap-storage
      MINIO_USE_SSL: false
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_ADMIN_API_KEY: ${TYPESENSE_ADMIN_API_KEY}
      # Hub Protocol inbound auth key (used by intelligence services calling this backend)
      HUB_PROTOCOL_API_KEY: ${HUB_PROTOCOL_API_KEY:-}
      # Callback URL for Intelligence Hub to reach this backend (Docker internal)
      PUBLIC_URL: ${PUBLIC_URL:-http://backend:4000}
      # Control Plane Integration (optional for self-hosted; required for SaaS pods)
      # Pods fetch /.well-known/jwks.json from CONTROL_PLANE_URL to verify ES256 JWTs.
      # No shared secret required — only the public JWKS endpoint is needed.
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # AI Providers
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      ORY_HYDRA_SECRETS_SYSTEM: ${ORY_HYDRA_SECRETS_SYSTEM}
      REALTIME_URL: http://realtime:4001
      HUB_JWT_SECRET: ${HUB_JWT_SECRET:-}
      INTELLIGENCE_HUB_URL: ${INTELLIGENCE_HUB_URL:-}
      INTELLIGENCE_HUB_API_KEY: ${INTELLIGENCE_HUB_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - synap-net

  # ============================================================================
  # REALTIME SERVER (WebSocket/Socket.IO)
  # Same image as backend — different working directory and entry point
  # ============================================================================
  realtime:
    image: ghcr.io/${GITHUB_REPOSITORY:-synap-core/backend}:${BACKEND_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    working_dir: /app/realtime
    command: node dist/server.js
    environment:
      NODE_ENV: production
      REALTIME_PORT: 4001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATABASE_URL: postgresql://synap:${POSTGRES_PASSWORD}@postgres:5432/synap
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: synap-storage
      MINIO_USE_SSL: false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "4001:4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4001/bridge/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - synap-net
    # Ensure proper DNS resolution (Docker's internal DNS can be flaky)
    dns:
      - 127.0.0.11 # Docker's internal DNS

  # ============================================================================
  # CODE MIGRATION SERVICE
  # ============================================================================
  backend-migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-synap-core/backend}:${BACKEND_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://synap:${POSTGRES_PASSWORD}@postgres:5432/synap
      HUB_PROTOCOL_API_KEY: ${HUB_PROTOCOL_API_KEY:-}
      HUB_PROTOCOL_API_KEYS: ${HUB_PROTOCOL_API_KEYS:-}
      NODE_ENV: production
    # Run migrations then seed hub protocol API keys in one shot
    # (Merged from former backend-init service to avoid orphaned container issues)
    command: >
      sh -c "node node_modules/@synap/database/dist/scripts/migrate.js &&
             node node_modules/@synap/database/dist/scripts/init-hub-keys.js"
    # One-shot service — runs once and exits. 'no' is correct for standalone Compose
    # (deploy.restart_policy is Docker Swarm only and is ignored here)
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synap-net

    # ============================================================================
    # POSTGRESQL
    # ============================================================================
  postgres:
    image: timescale/timescaledb-ha:pg15
    restart: always
    environment:
      POSTGRES_USER: synap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synap
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    networks:
      - synap-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - synap-net
    # No public port — Redis only accessible within Docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # MINIO (Object Storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - synap-net
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================================
  # TYPESENSE (Search)
  # ============================================================================
  typesense:
    image: typesense/typesense:0.25.2
    restart: always
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_ADMIN_API_KEY}
      --search-only-api-key=${TYPESENSE_API_KEY}
      --enable-cors
    volumes:
      - typesense_data:/data
    networks:
      - synap-net
    ports:
      - "8108:8108"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/8108' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # ORY KRATOS (Authentication)
  # ============================================================================
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synap-net

  kratos:
    image: oryd/kratos:v1.3.1
    restart: always
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER}
      SERVE_PUBLIC_BASE_URL: https://${DOMAIN}/.ory/kratos/public/
      SERVE_ADMIN_BASE_URL: https://${DOMAIN}/.ory/kratos/admin/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN}/login
      IDENTITY_SCHEMAS_0_ID: default
      IDENTITY_SCHEMAS_0_URL: file:///etc/config/kratos/identity.schema.json
      DOMAIN: ${DOMAIN}
      KRATOS_WEBHOOK_SECRET: ${KRATOS_WEBHOOK_SECRET}
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml", "--watch-courier"]
    # Note: --dev flag removed for production security
    # Add --dev back only for local development
    volumes:
      - ../kratos:/etc/config/kratos
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "4433:4433"
      - "4434:4434"
    networks:
      - synap-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:4433/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # ORY HYDRA (OAuth2)
  # ============================================================================
  hydra-migrate:
    image: oryd/hydra:v2.3.0
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
    command: migrate sql up -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synap-net

  hydra:
    image: oryd/hydra:v2.3.0
    restart: always
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: https://${DOMAIN}
      URLS_CONSENT: https://${DOMAIN}/consent
      URLS_LOGIN: https://${DOMAIN}/login
      SECRETS_SYSTEM: ${ORY_HYDRA_SECRETS_SYSTEM}
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - synap-net
    ports:
      - "4444:4444"
      - "4445:4445"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:4445/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # CADDY (Reverse Proxy + SSL)
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # IMPORTANT: Use absolute path or ensure docker compose is run from deploy/ directory
      # Relative path ./Caddyfile requires running: cd deploy && docker compose up
      # For production, consider using absolute path: /srv/synap/synap-backend/deploy/Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - synap-net
    depends_on:
      backend:
        condition: service_started
      # Realtime is optional - Caddy should start even if realtime is down
      # This ensures the API still works even if realtime crashes
      realtime:
        condition: service_started # Changed from service_healthy to service_started (less strict)
    dns:
      - 127.0.0.11 # Docker's internal DNS (for container names)
      - 1.1.1.1 # Cloudflare (for external domains like ACME CAs)
      - 8.8.8.8 # Google (fallback)

  # ============================================================================
  # OPENCLAW (opt-in — managed via control plane /openclaw/provision)
  #
  # Uncomment and configure to add OpenClaw as a world-interface agent.
  # OpenClaw provides: shell, filesystem, browser automation, and messaging
  # channels (Telegram, WhatsApp, Slack, Discord, iMessage, Teams...).
  #
  # Environment variables are injected automatically by the provisioning flow.
  # Manual setup: copy this block, fill in SYNAP_* vars, run:
  #   docker compose up -d openclaw
  #   openclaw skill install https://raw.githubusercontent.com/synap-app/synap-backend/main/skills/synap-os/SKILL.md
  # ============================================================================
  # openclaw:
  #   container_name: openclaw
  #   image: ghcr.io/openclaw/openclaw:latest
  #   restart: unless-stopped
  #   volumes:
  #     - openclaw_config:/root/.openclaw
  #     - openclaw_workspace:/root/openclaw/workspace
  #   environment:
  #     - SYNAP_POD_URL=${SYNAP_POD_URL:-http://backend:4000}
  #     - SYNAP_HUB_API_KEY=${OPENCLAW_HUB_API_KEY}        # From /openclaw/register or Settings → API Keys
  #     - SYNAP_WORKSPACE_ID=${SYNAP_WORKSPACE_ID}          # Your workspace UUID
  #     - OPENCLAW_MODEL=anthropic/claude-sonnet-4-6        # AI model for OpenClaw
  #     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}            # Required for the model above
  #   ports:
  #     - "18789:18789"   # OpenClaw gateway (HTTP + WebSocket)
  #   networks:
  #     - synap-net
  #   profiles:
  #     - openclaw

  # ============================================================================
  # MONITORING (Dozzle)
  # ============================================================================
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    networks:
      - synap-net
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  minio_data:
  typesense_data:
  caddy_data:
  caddy_config:
  openclaw_config:
  openclaw_workspace:

networks:
  synap-net:
    driver: bridge
