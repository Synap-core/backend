services:
  # ============================================================================
  # BACKEND API
  # ============================================================================
  backend:
    # Try to use pre-built image from GitHub Container Registry first
    # If image doesn't exist, falls back to building from source
    # Set BACKEND_VERSION in .env to pin a specific version (e.g., v1.2.3)
    # Defaults to 'latest' if not set
    image: ghcr.io/${GITHUB_REPOSITORY:-synap-core/backend}:${BACKEND_VERSION:-latest}
    # Build fallback: if image pull fails, build from source
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://synap:${POSTGRES_PASSWORD}@postgres:5432/synap
      ADMIN_EMAIL: ${ADMIN_EMAIL:-} # For self-hosted: admin email
      PROVISIONING_TOKEN: ${PROVISIONING_TOKEN:-} # For control-plane-provisioned: one-time token for admin invitation
      JWT_SECRET: ${JWT_SECRET}
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      KRATOS_SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE}
      KRATOS_SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER}
      KRATOS_WEBHOOK_SECRET: ${KRATOS_WEBHOOK_SECRET}
      HYDRA_PUBLIC_URL: http://hydra:4444
      HYDRA_ADMIN_URL: http://hydra:4445
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: synap-storage
      MINIO_USE_SSL: false
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_ADMIN_API_KEY: ${TYPESENSE_ADMIN_API_KEY}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ORY_HYDRA_SECRETS_SYSTEM: ${ORY_HYDRA_SECRETS_SYSTEM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - synap-net

  # ============================================================================
  # REALTIME SERVER (WebSocket/Socket.IO)
  # ============================================================================
  realtime:
    # Use same image as backend service (pulls or builds same way)
    image: ghcr.io/${GITHUB_REPOSITORY:-synap-core/backend}:${BACKEND_VERSION:-latest}
    # Build fallback: if image pull fails, build from source
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      REALTIME_PORT: 4001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://synap:${POSTGRES_PASSWORD}@postgres:5432/synap
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: synap-storage
      MINIO_USE_SSL: false
    command: node node_modules/@synap/realtime/dist/server.js
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "4001:4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4001/bridge/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - synap-net

  # ============================================================================
  # CODE MIGRATION SERVICE
  # ============================================================================
  backend-migrate:
    # Use same image as backend service (pulls or builds same way)
    image: ghcr.io/${GITHUB_REPOSITORY:-synap-core/backend}:${BACKEND_VERSION:-latest}
    # Build fallback: if image pull fails, build from source
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://synap:${POSTGRES_PASSWORD}@postgres:5432/synap
      NODE_PATH: /app/node_modules
    command: node node_modules/@synap/database/dist/scripts/migrate.js
    # Migration service should run once and exit successfully
    # No restart needed - migrations are idempotent
    deploy:
      restart_policy:
        condition: no
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synap-net
    # Mark as a one-shot service (runs once, then stops)
    # Removed profile - migrations should run automatically on startup

  # ============================================================================
  # POSTGRESQL
  # ============================================================================
  postgres:
    image: timescale/timescaledb-ha:pg15
    restart: always
    environment:
      POSTGRES_USER: synap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synap
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    networks:
      - synap-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - synap-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # MINIO (Object Storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - synap-net
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================================
  # TYPESENSE (Search)
  # ============================================================================
  typesense:
    image: typesense/typesense:0.25.2
    restart: always
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors"
    volumes:
      - typesense_data:/data
    networks:
      - synap-net
    ports:
      - "8108:8108"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # ORY KRATOS (Authentication)
  # ============================================================================
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synap-net

  kratos:
    image: oryd/kratos:v1.3.1
    restart: always
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER}
      SERVE_PUBLIC_BASE_URL: https://${DOMAIN}/.ory/kratos/public/
      SERVE_ADMIN_BASE_URL: https://${DOMAIN}/.ory/kratos/admin/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: https://${DOMAIN}/login
      IDENTITY_SCHEMAS_0_ID: default
      IDENTITY_SCHEMAS_0_URL: file:///etc/config/kratos/identity.schema.json
      DOMAIN: ${DOMAIN}
      KRATOS_WEBHOOK_SECRET: ${KRATOS_WEBHOOK_SECRET}
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml", "--watch-courier"]
    # Note: --dev flag removed for production security
    # Add --dev back only for local development
    volumes:
      - ../kratos:/etc/config/kratos
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "4433:4433"
      - "4434:4434"
    networks:
      - synap-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:4433/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # ORY HYDRA (OAuth2)
  # ============================================================================
  hydra-migrate:
    image: oryd/hydra:v2.3.0
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
    command: migrate sql up -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - synap-net

  hydra:
    image: oryd/hydra:v2.3.0
    restart: always
    environment:
      DSN: postgres://synap:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: https://${DOMAIN}
      URLS_CONSENT: https://${DOMAIN}/consent
      URLS_LOGIN: https://${DOMAIN}/login
      SECRETS_SYSTEM: ${ORY_HYDRA_SECRETS_SYSTEM}
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - synap-net
    ports:
      - "4444:4444"
      - "4445:4445"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:4445/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # INNGEST (Background Jobs)
  # ============================================================================
  inngest:
    image: inngest/inngest:latest
    restart: always
    command: inngest dev
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
    networks:
      - synap-net

  # ============================================================================
  # CADDY (Reverse Proxy + SSL)
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # IMPORTANT: Use absolute path or ensure docker compose is run from deploy/ directory
      # Relative path ./Caddyfile requires running: cd deploy && docker compose up
      # For production, consider using absolute path: /srv/synap/synap-backend/deploy/Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - synap-net
    depends_on:
      - backend

  # ============================================================================
  # MONITORING (Dozzle)
  # ============================================================================
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8888:8080"
    networks:
      - synap-net
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  minio_data:
  typesense_data:
  caddy_data:
  caddy_config:

networks:
  synap-net:
    driver: bridge
