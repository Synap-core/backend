# Synap CI — canonical repo manifest
#
# The single place that declares how each repo publishes and which invariants
# hold across all of them. `ci/scripts/check.mjs` enforces the rules below and
# fails CI when a workflow drifts.
#
# WHY RULES AND NOT GENERATED WORKFLOW FILES
# An earlier version of this directory generated each repo's workflow from one
# template. That was wrong: synap-app versions via changesets, the backend has
# drift-gated conditional publish steps keyed off a step output, and the CLI is
# a single package. A linear template cannot express conditional or id-gated
# steps, and flattening them dropped real logic (the backend's `if: bumped ==
# 'true'` guard and its commit-back step). "One shared config" is therefore
# enforced as RULES every workflow must satisfy, not as a generated file shape.
#
# WHY EACH REPO STILL OWNS A REAL WORKFLOW FILE
# npm Trusted Publishing identifies a publisher by (repository, workflow
# filename). A workflow pulled in via `uses: owner/repo/.github/workflows/x.yml@ref`
# changes the OIDC identity npm validates against, so authentication would
# break. Per-repo files are required; the gate is what keeps them consistent.
#
# Run the gate:  node ci/scripts/check.mjs

version: 1

repos:
  synap-app:
    description: Frontend packages (pnpm monorepo, 66 public packages)
    # App internals are release-managed by changesets. Contract packages are not:
    # their version is a lockstep stamp across three files and is bumped only
    # when the generated surface changes. See ci/README.md "Release classes".
    node: "22.18.0" # must satisfy engines.node (>=22.18.0)
    pnpm_from: packageManager
    changeset_ignore: .changeset/config.json
    publish_workflows:
      - changeset.yml
      - publish-packages.yml
      - publish-official-templates.yml

  synap-backend:
    description: Data Pod API + the cross-repo contract packages
    # .node-version is the SSOT here. Node 20 is DELIBERATE: an artifact was
    # once published from Node 22.22.3 and broke. Do not "upgrade" this.
    node_version_file: .node-version
    pnpm_from: packageManager
    version_authority: check-and-bump.mjs
    lockstep_stamps:
      - packages/api-types/package.json
      - packages/api-types/src/version.ts
      - apps/api/src/index.ts
    publish_workflows:
      - publish-types.yml

  synap-cli:
    description: npx @synap-core/cli
    node: "20.18.1"
    publish_workflows:
      - publish-cli.yml

  # Not an npm publisher — electron-builder ships GitHub release assets, and
  # `NODE_AUTH_TOKEN` here only reads @synap-core/* from private repos. Listed so
  # a future npm publish in this repo is a deliberate decision, not an accident.
  browser:
    description: Electron desktop app (WORKBENCH)
    pnpm_from: packageManager
    npm_publisher: false

# Public synap-app packages that reach npm through a door OTHER than the
# changesets `ignore` list. Kept here so the manifest is the one place to look.
#
# The authoritative ignore list is synap-app/.changeset/config.json, generated by
# synap-app/scripts/sync-changeset-ignore.mjs — run `node scripts/sync-changeset-ignore.mjs`
# to regenerate, and `--check` in CI to catch drift. Do not hand-edit the list.
changeset_exceptions:
  - package: "@synap-core/dsh-plugin"
    reason: >-
      The ONE package changesets is meant to version. It is the sole entry in
      sync-changeset-ignore.mjs PUBLISHABLE, which inverts the problem: ignore
      is every workspace package EXCEPT the allowlist. So it must stay ABSENT
      from ignore — adding it there silently disables its release.
  - package: "@synap-core/create-synap-app"
    reason: >-
      The npx create-synap-app scaffolder at synap-app/create-synap-app/. It sits
      outside every pnpm-workspace glob, so changesets cannot reach it either
      way; it is released deliberately and manually.

# Package names with exactly ONE home on disk. check.mjs rule 7 fails when any
# other package.json — public or private, in any repo — declares the name.
single_home:
  - package: "@synap-core/control-plane-types"
    home: synap-app/packages/core/control-plane-types
    reason: >-
      Resolved 2026-10-06. Two copies (synap-app 1.1.0, synap-control-plane-api
      1.0.2) had drifted: browser compiled against the CP copy, relay and the
      synap-app packages against synap-app's. synap-app is the home: the pnpm
      workspace already resolved every consumer there, synap-app is the only repo
      whose changesets workspace carries the name, and its standalone CI cannot
      see a sibling repo. The CP — which produces these shapes but cannot import
      the package (rootDir) — keeps its own derivation in src/lib and pins it to
      this copy with src/lib/billing-state.parity.test.ts.

# Cross-repo invariants that no single repo can enforce on its own.
open_conflicts:
  - package: "@synap-core/chat-ui"
    repos: [synap-app, hestia-cli]
    versions: ["0.1.0", "0.1.0"]
    issue: >-
      hestia-cli carries a source copy at packages/@synap-core/chat-ui (a nested path
      outside its workspace globs). It is never published — that repo ships GitHub
      release assets, not npm — so this is latent confusion rather than a broken tag,
      but a stray `npm publish` from hestia-cli would collide with synap-app's copy.
    status: open
