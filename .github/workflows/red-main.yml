name: Red main

# When backend main goes red, name the PR that did it and tell its pod
# session; when nobody fixes it within 30 min, open a revert PR that jumps the
# merge queue (founder decision 0b4db9f7). The rules live once, in
# scripts/ci/culprit-finder.mjs (header, verdict(), revertDecision()).
# Tripwire: scripts/ci/culprit-finder.tripwire.test.ts.
#
#   name    a push run of CI on main that ended `failure`
#   bisect  only when the mapping leaves a file unsettled: re-runs those files
#           at a few commits. Runs merged code, so it holds NO token and NO pod
#           or bot secret, and its result is checked by `post`.
#   post    main's own finder posts the verdict after the bisect
#   sweep   every 10 min: the revert, in environment ci-bots (main only), which
#           holds the merge bot app's secrets. A push or a PR made with
#           GITHUB_TOKEN would start no CI, so the revert needs that app.
#
# A CI run of a PR skips every job here by its `if:` (no runner). Without the
# bot secrets the sweep logs what it would do; without the pod
# (SYNAP_POD_URL, SYNAP_OBS_KEY with hub-protocol.read + write,
# vars.SYNAP_POD_WORKSPACE_ID) no session is told and every revert is held.
# workflow_run and schedule run the DEFAULT BRANCH's copy of this file.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sweep: judge a revert now; name: name the culprit of a run"
        type: choice
        options: [sweep, name]
        default: sweep
      run_id:
        description: "name: the id of a red push run of CI on main"
        type: string
        default: ""
      dry_run:
        description: Judge and log only; post nothing, revert nothing
        type: boolean
        default: true

permissions: {}

concurrency:
  # One naming per red run; the sweeps one at a time (two must never open
  # two reverts).
  group: red-main-${{ github.event_name == 'workflow_run' && format('name-{0}', github.event.workflow_run.id) || 'sweep' }}
  cancel-in-progress: false

jobs:
  name:
    name: Name the culprit
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'name')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # the run's jobs and their logs
      actions: read
      # the record check run on the red commit
      checks: write
      # the comment on the culprit PR
      issues: write
      pull-requests: read
    outputs:
      bisect: ${{ steps.name.outputs.bisect }}
      plan: ${{ steps.name.outputs.plan }}
    steps:
      # main's history: the commits since the last all-green main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 60
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Name the culprit
        id: name
        run: node scripts/ci/culprit-finder.mjs name
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
          SYNAP_POD_URL: ${{ secrets.SYNAP_POD_URL }}
          SYNAP_OBS_KEY: ${{ secrets.SYNAP_OBS_KEY }}
          SYNAP_POD_WORKSPACE_ID: ${{ vars.SYNAP_POD_WORKSPACE_ID }}
          CULPRIT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  bisect:
    name: Bisect the failing files
    needs: name
    if: ${{ needs.name.outputs.bisect == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # No token and no pod or bot secret: the probes run merged commits' code.
    permissions:
      contents: read
    outputs:
      result: ${{ steps.probe.outputs.result }}

    # The probes run the failing tests, which read a migrated database: one
    # fresh database per probe (scripts/ci/culprit-finder.mjs makeProbe).
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 60
          persist-credentials: false

      # The probes check other commits out: the finder runs from a copy of
      # the default branch's scripts.
      - name: Keep the default branch's finder
        run: |
          mkdir -p "$RUNNER_TEMP/finder/scripts/ci"
          cp scripts/ci/culprit-finder.mjs scripts/ci/affected.mjs scripts/ci/import-graph.mjs scripts/ci/release-gate-wait.mjs "$RUNNER_TEMP/finder/scripts/ci/"
          cp scripts/tripwire-discovery.mjs scripts/pod-observation.mjs scripts/strip-comments.mjs "$RUNNER_TEMP/finder/scripts/"

      # The read-only Reader App lays out the private siblings the
      # cross-repo tests read (as every ci.yml job that installs).
      - name: Monorepo layout + dependencies
        uses: ./.github/actions/monorepo-setup
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          app-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Probe the range
        id: probe
        continue-on-error: true
        timeout-minutes: 60
        run: node "$RUNNER_TEMP/finder/scripts/ci/culprit-finder.mjs" bisect
        env:
          PLAN: ${{ needs.name.outputs.plan }}
          CULPRIT_ROOT: ${{ github.workspace }}
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

  post:
    name: Post the verdict
    needs: [name, bisect]
    # Also when the bisect failed or timed out: the mapping's verdict posts.
    if: ${{ !cancelled() && needs.name.outputs.bisect == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: read
    steps:
      # The DEFAULT branch's finder, never the bisect job's copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Post the verdict
        run: node scripts/ci/culprit-finder.mjs post
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.name.outputs.plan }}
          RESULT: ${{ needs.bisect.outputs.result }}
          SYNAP_POD_URL: ${{ secrets.SYNAP_POD_URL }}
          SYNAP_OBS_KEY: ${{ secrets.SYNAP_OBS_KEY }}
          SYNAP_POD_WORKSPACE_ID: ${{ vars.SYNAP_POD_WORKSPACE_ID }}
          CULPRIT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  sweep:
    name: Revert a culprit nobody fixes
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sweep') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The merge bot app's secrets live only here (main only).
    environment: ci-bots
    permissions:
      contents: read
      actions: read
      checks: read
      # the once-only "held" / "reverted" notes on the culprit PR
      issues: write
      pull-requests: read
    env:
      REVERT_CONFIGURED: ${{ secrets.SYNAP_MERGE_BOT_APP_ID != '' && secrets.SYNAP_MERGE_BOT_KEY != '' }}
    steps:
      # main deep enough to hold the culprit merge and its first parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 200
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      # The writer: a push and a PR that START CI. A failed mint leaves the
      # token empty, and the sweep then writes no revert (fail-safe).
      - name: Mint the revert token (Synap Merge Bot app)
        id: bot-token
        if: ${{ env.REVERT_CONFIGURED == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.SYNAP_MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.SYNAP_MERGE_BOT_KEY }}
          owner: Synap-core
          repositories: backend
          permission-contents: write
          permission-pull-requests: write

      - name: Revert a culprit nobody fixes
        run: node scripts/ci/culprit-finder.mjs sweep
        env:
          GH_TOKEN: ${{ github.token }}
          REVERT_TOKEN: ${{ steps.bot-token.outputs.token }}
          SYNAP_POD_URL: ${{ secrets.SYNAP_POD_URL }}
          SYNAP_OBS_KEY: ${{ secrets.SYNAP_OBS_KEY }}
          SYNAP_POD_WORKSPACE_ID: ${{ vars.SYNAP_POD_WORKSPACE_ID }}
          CULPRIT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
