name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: image-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=main" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Pull latest image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }} || \
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main || \
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to staging
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/synap/deploy || cd /opt/synap
            # Login to GHCR if needed
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            # Pull latest image
            docker compose pull backend || true
            # Update services
            docker compose up -d backend
            # Run migrations
            docker compose exec -T backend-migrate node node_modules/@synap/database/dist/scripts/migrate.js || \
            docker compose exec -T backend node node_modules/@synap/database/dist/scripts/migrate.js || true

      - name: Wait for health check
        run: |
          sleep 10
          curl -f https://staging.synap.app/health || exit 1

      - name: Run smoke tests
        run: |
          npx newman run tests/postman/smoke-tests.json \
            --env-var baseUrl=https://staging.synap.app \
            --bail

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/synap/deploy || cd /opt/synap
            # Rollback to previous image tag if available
            if docker images | grep -q "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:previous"; then
              docker compose down backend
              # Update docker-compose.yml to use previous tag (manual or via script)
              docker compose up -d backend
            else
              echo "No previous image found for rollback"
            fi

      - name: Notify deployment
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Staging deployment ${{ job.status }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
