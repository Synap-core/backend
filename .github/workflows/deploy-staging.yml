name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Convert repository name to lowercase (required for Docker registry)
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag and name
        id: image
        run: |
          # Convert to lowercase for Docker registry
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${REPO_OWNER}/${REPO_NAME}"
          echo "name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=main" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Pull latest image
        run: |
          IMAGE_NAME="${{ steps.image.outputs.name }}"
          TAG="${{ steps.image.outputs.tag }}"
          docker pull ${{ env.REGISTRY }}/${IMAGE_NAME}:${TAG} || \
          docker pull ${{ env.REGISTRY }}/${IMAGE_NAME}:main || \
          docker pull ${{ env.REGISTRY }}/${IMAGE_NAME}:latest || \
          echo "⚠️  Image not found, deployment will skip"

      - name: Deploy to staging
        if: secrets.STAGING_HOST != ''
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/synap/deploy || cd /opt/synap
            # Login to GHCR if needed
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            # Pull latest image
            docker compose pull backend || true
            # Update services
            docker compose up -d backend
            # Run migrations
            docker compose exec -T backend-migrate node node_modules/@synap/database/dist/scripts/migrate.js || \
            docker compose exec -T backend node node_modules/@synap/database/dist/scripts/migrate.js || true

      - name: Wait for health check
        if: secrets.STAGING_HOST != ''
        run: |
          sleep 10
          curl -f https://staging.synap.app/health || exit 1

      - name: Run smoke tests
        if: secrets.STAGING_HOST != ''
        run: |
          if [ -f "tests/postman/smoke-tests.json" ]; then
            npx newman run tests/postman/smoke-tests.json \
              --env-var baseUrl=https://staging.synap.app \
              --bail
          else
            echo "⚠️  Smoke tests not found, skipping"
          fi

      - name: Rollback on failure
        if: failure() && secrets.STAGING_HOST != ''
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/synap/deploy || cd /opt/synap
            # Rollback to previous image tag if available
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="${REPO_OWNER}/${REPO_NAME}"
            if docker images | grep -q "${{ env.REGISTRY }}/${IMAGE_NAME}:previous"; then
              docker compose down backend
              # Update docker-compose.yml to use previous tag (manual or via script)
              docker compose up -d backend
            else
              echo "No previous image found for rollback"
            fi

      - name: Notify deployment
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Staging deployment ${{ job.status }}"
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
