name: Deploy to Staging

on:
  push:
    branches: ["develop"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Run on direct push to develop, or when CI passes on develop
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    environment: staging
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if staging secrets are configured
        id: check-secrets
        run: |
          if [ -n "${{ secrets.STAGING_POD_URL }}" ]; then
            echo "staging_configured=true" >> $GITHUB_OUTPUT
          else
            echo "staging_configured=false" >> $GITHUB_OUTPUT
            echo "Staging secrets not configured — deployment skipped"
          fi

          if [ -n "${{ secrets.STAGING_HUB_API_KEY }}" ]; then
            echo "hub_api_key_configured=true" >> $GITHUB_OUTPUT
          else
            echo "hub_api_key_configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to staging pod via CP API
        if: steps.check-secrets.outputs.staging_configured == 'true'
        run: |
          curl -sf -X POST "${{ secrets.CP_API_URL }}/admin/pods/${{ secrets.STAGING_POD_ID }}/action" \
            -H "Authorization: Bearer ${{ secrets.CP_ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"update\",\"targetVersion\":\"${{ github.sha }}\"}" \
            || echo "Deploy trigger failed (non-fatal — pod may self-update)"
        continue-on-error: true

      - name: Wait for staging to be healthy (2 min)
        if: steps.check-secrets.outputs.staging_configured == 'true'
        run: |
          for i in $(seq 1 24); do
            if curl -sf "${{ secrets.STAGING_POD_URL }}/health" > /dev/null; then
              echo "Staging healthy after attempt $i"
              exit 0
            fi
            echo "Waiting... attempt $i/24"
            sleep 5
          done
          echo "Staging did not become healthy in time"
          exit 1

      - name: Run smoke tests against staging
        if: steps.check-secrets.outputs.staging_configured == 'true' && steps.check-secrets.outputs.hub_api_key_configured == 'true'
        run: |
          chmod +x scripts/smoke-test.sh
          BASE_URL="${{ secrets.STAGING_POD_URL }}" \
          HUB_API_KEY="${{ secrets.STAGING_HUB_API_KEY }}" \
          bash scripts/smoke-test.sh
        env:
          BASE_URL: ${{ secrets.STAGING_POD_URL }}
          HUB_API_KEY: ${{ secrets.STAGING_HUB_API_KEY }}

      - name: Run health-only smoke tests (no API key)
        if: steps.check-secrets.outputs.staging_configured == 'true' && steps.check-secrets.outputs.hub_api_key_configured == 'false'
        run: |
          chmod +x scripts/smoke-test.sh
          BASE_URL="${{ secrets.STAGING_POD_URL }}" \
          bash scripts/smoke-test.sh
        env:
          BASE_URL: ${{ secrets.STAGING_POD_URL }}

      - name: Rollback on failure
        if: failure() && steps.check-secrets.outputs.staging_configured == 'true'
        run: |
          echo "Deployment failed — triggering rollback via CP API"
          curl -sf -X POST "${{ secrets.CP_API_URL }}/admin/pods/${{ secrets.STAGING_POD_ID }}/action" \
            -H "Authorization: Bearer ${{ secrets.CP_ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"rollback\"}" \
            || echo "Rollback trigger failed — manual intervention may be needed"
        continue-on-error: true
