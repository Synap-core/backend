name: Publish Type Packages

on:
  push:
    branches: [main]
    paths:
      - "synap-backend/packages/types/src/**"
      - "synap-backend/packages/api/src/routers/**"
      - "synap-backend/packages/api/src/root.ts"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install backend dependencies
        run: cd synap-backend && pnpm install --frozen-lockfile

      - name: Build types package
        run: cd synap-backend/packages/types && pnpm build

      - name: Build API package
        run: cd synap-backend/packages/api && pnpm build

      - name: Regenerate API types
        run: cd synap-backend/packages/api && node scripts/gen-types.mjs

      - name: Build api-types package
        run: cd synap-backend/packages/api-types && pnpm build

      - name: Auto-bump patch versions
        run: |
          cd synap-backend/packages/types
          npm version patch --no-git-tag-version
          cd ../api-types
          npm version patch --no-git-tag-version

      - name: Publish @synap-core/types
        run: cd synap-backend/packages/types && pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @synap-core/api-types
        run: cd synap-backend/packages/api-types && pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add synap-backend/packages/types/package.json synap-backend/packages/api-types/package.json
          git commit -m "chore: auto-publish type packages [skip ci]" || true
          git push
