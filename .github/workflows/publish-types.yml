name: Publish Type Packages

on:
  # Manual publish door. Hand-publishing from a laptop is the proven root cause
  # of the broken releases (an artifact was published from node 22.22.3 while
  # this workflow pins node 20) — so there must be a CI button to press instead.
  workflow_dispatch:
  push:
    branches: [main]
    # Repo-root-relative. These were once prefixed `synap-backend/` from a
    # monorepo layout that no longer exists — with that prefix the filter could
    # never match and this workflow never fired, which is how publishing ended
    # up being done by hand.
    paths:
      - "packages/types/src/**"
      - "packages/api/src/routers/**"
      - "packages/api/src/root.ts"

# Publishing is not idempotent at the transport layer: killing a run mid-publish
# can leave a version half-uploaded. Serialise publishes; never cancel.
concurrency:
  group: npm-publish
  cancel-in-progress: false

# Least privilege: jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # D16: a publish from main waits for the `production` environment's
    # required reviewer; a manual run on another branch uses no environment.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || '' }}
    # Least privilege. `contents: write` is required because this workflow pushes
    # the version-bump commit back to main at the end (`contents: read` made that
    # final `git push` 403 AFTER npm had already accepted the version, so the
    # registry ran ahead of the repo). `id-token: write` is required for npm
    # Trusted Publishing (OIDC) — see the auth note below.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the final step rebases the bump commit onto a main that
          # moved during the run (a shallow clone has no merge base to rebase on).
          fetch-depth: 0

      # Version comes from the repo's `packageManager: pnpm@10.28.0`, which pins
      # it MORE precisely than a `version: 10` input would. Passing both makes
      # action-setup fail with "Multiple versions of pnpm specified" — which
      # happened here and meant this pipeline never published. Do not add
      # `version:` back.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 20 is DELIBERATE. An artifact was once published from node
          # 22.22.3 and broke consumers; CI pins the version `.node-version`
          # declares so there is exactly one source of truth.
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      # BUILD THROUGH TURBO, NOT `cd <pkg> && pnpm build`.
      #
      # Those two `cd` steps built one package each and NOTHING they depend on,
      # so this pipeline failed on every run — the very first build step, not the
      # second:
      #
      #   error TS2307: Cannot find module '@synap/database' or its
      #     corresponding type declarations   (packages/types/src/users/index.ts:23)
      #
      # `packages/types` imports `@synap/database`, whose `dist/` is gitignored
      # (`.gitignore:6`, 0 files tracked). On a laptop that dist is left over
      # from some earlier build, so the `cd` steps appear to work; a fresh CI
      # checkout has no dist and there is nothing to resolve. The pipeline was
      # therefore green only where it did not need to be.
      #
      # The ordering is NOT hand-listed here. turbo.json declares
      # `build: { dependsOn: ["^build"] }`, so selecting a package pulls its
      # whole workspace dependency chain into the task graph, topologically
      # ordered. A new dependency is picked up by the graph; there is no second
      # list to keep in step with package.json.
      #
      # `turbo`, not `pnpm --filter`, for a second reason: a `pnpm --filter` that
      # matches nothing prints "No projects matched" and EXITS 0 — a false green.
      # Measured on this repo: `pnpm --filter @synap/does-not-exist build` → 0;
      # `turbo run build --filter=@synap/does-not-exist` → 1.
      - name: Build @synap-core/types (and its workspace dependencies)
        run: pnpm turbo run build --filter=@synap-core/types

      - name: Build @synap/api (and its workspace dependencies)
        run: pnpm turbo run build --filter=@synap/api

      # Bump to the next patch NOT already on npm. A run that published but
      # failed to push its bump commit would otherwise re-bump to a version npm
      # already holds and fail with "cannot publish over an existing version".
      # `npm view` of a missing version exits 0 with no output on some npm
      # versions and 1 on others, so "published" is decided on the output.
      - name: Bump @synap-core/types to the next unpublished patch
        run: |
          cd packages/types
          published() { [ -n "$(npm view "@synap-core/types@$1" version 2>/dev/null)" ]; }
          npm version patch --no-git-tag-version >/dev/null
          V=$(node -p "require('./package.json').version")
          while published "$V"; do
            npm version patch --no-git-tag-version >/dev/null
            V=$(node -p "require('./package.json').version")
          done
          echo "@synap-core/types -> $V"

      # ONE bump authority for @synap-core/api-types (was: this workflow's own
      # blind `npm version patch`, uncoordinated with
      # packages/api-types/scripts/check-and-bump.mjs — two authorities that
      # could disagree). check-and-bump.mjs regenerates generated.d.ts itself
      # (do NOT also run `gen-types.mjs` as a separate prior step — it would
      # make check-and-bump.mjs's own before/after diff compare identical
      # freshly-regenerated content and never bump), diffs it against the
      # committed version, and — only when the router surface actually
      # changed — bumps package.json + src/version.ts + apps/api's /health
      # literal together. `bumped` output gates the publish step below so a
      # no-surface-change run never tries to re-publish an unchanged version
      # (which `npm publish` would reject anyway).
      - name: Drift-aware bump @synap-core/api-types (check-and-bump.mjs)
        id: bump-api-types
        run: |
          cd packages/api-types
          published() { [ -n "$(npm view "@synap-core/api-types@$1" version 2>/dev/null)" ]; }
          BEFORE=$(node -p "require('./package.json').version")
          node scripts/check-and-bump.mjs
          V=$(node -p "require('./package.json').version")
          # Publish iff the version in the repo is not on npm yet. An unchanged
          # surface whose version was never published (a release that failed
          # mid-way, or a hand bump) must still go out; a surface change bumped
          # onto a version npm already holds moves on to the next free patch.
          if published "$V"; then
            if [ "$BEFORE" = "$V" ]; then
              echo "@synap-core/api-types $V is already on npm and unchanged: nothing to publish"
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            while published "$V"; do
              npm version patch --no-git-tag-version >/dev/null
              V=$(node -p "require('./package.json').version")
            done
          fi
          # Keep every hard-coded copy of the version in lock-step with the
          # package (check-and-bump only writes them when it bumps).
          perl -pi -e 's/(API_TYPES_VERSION = ")[^"]+/${1}'"$V"'/' src/version.ts
          perl -pi -e 's/(apiTypesVersion: ")[^"]+/${1}'"$V"'/' ../../apps/api/src/index.ts
          echo "@synap-core/api-types -> $V"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Build api-types package
        run: cd packages/api-types && pnpm build

      # ── Publish ────────────────────────────────────────────────────────────
      # npm Trusted Publishing needs Node >= 22.14.0 and npm >= 11.5.1 IN THE
      # PROCESS THAT PUBLISHES (SECURITY-RELEASE-RUNBOOK.md §2.1). Everything
      # above (install, turbo build, version bumps) stays on the Node 20 that
      # `.node-version` pins on purpose; only the publish steps below switch to
      # Node 22 (the same 22.18.0 the app-bases publish jobs use). Both pins are
      # EXACT: a floating `22` / `npm@11` would let a registry release change what
      # publishes. pnpm hands the upload to `npm publish`, so it is the npm on PATH
      # that exchanges the OIDC token.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.18.0"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing (exact pin, >= 11.5.1)
        run: npm install -g npm@11.20.0 && npm --version

      # Auth: npm Trusted Publishing (OIDC) only. No secret: npm mints a
      # short-lived credential for this job from its OIDC token (the
      # `id-token: write` permission above), and provenance comes with it.
      #
      # Each published package must trust this workflow on npmjs.com
      # (package → Settings → Trusted Publishers → Add — cannot be automated):
      #   for EACH package (@synap-core/types and @synap-core/api-types):
      #     Organization/user : Synap-core
      #     Repository        : Synap-core/backend
      #     Workflow filename : publish-types.yml
      #     Environment       : leave blank
      # Until a package trusts it, its publish step fails with E404/ENEEDAUTH.
      # The NPM_TOKEN repo secret is no longer read; delete it.
      - name: Publish @synap-core/types
        run: cd packages/types && pnpm publish --no-git-checks --provenance

      - name: Publish @synap-core/api-types
        if: steps.bump-api-types.outputs.bumped == 'true'
        run: cd packages/api-types && pnpm publish --no-git-checks --provenance

      # Backstop for the whole failure class: re-download what the registry now
      # serves and fail if any dependency range is `workspace:`/`file:` (i.e.
      # EUNSUPPORTEDPROTOCOL for every consumer). Inspects the ARTIFACT, never
      # the source manifest — see the script header for why this can never be a
      # prepublishOnly/prepack hook.
      - name: Verify published artifacts are installable
        run: |
          if [ "${{ steps.bump-api-types.outputs.bumped }}" = "true" ]; then
            node scripts/verify-publishable.mjs packages/types packages/api-types
          else
            node scripts/verify-publishable.mjs packages/types
          fi

      # TODO (B1, deferred): once published, open a PR bumping synap-app's
      # @synap-core/api-types pin to the new version (see
      # check-publish-freshness.mjs's synap-app range check in ci.yml, which
      # currently only DETECTS a stale pin — it does not fix it). Needs a
      # cross-repo token (CROSS_REPO_TOKEN) with write access to synap-app.
      # Blocked in practice while synap-app's pnpm overrides point
      # @synap-core/api-types at a `link:` into this repo — the pin is not
      # load-bearing there, so there is nothing to repin yet.

      - name: Commit version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/types/package.json \
                  packages/api-types/package.json \
                  packages/api-types/src/version.ts \
                  packages/api-types/src/generated.d.ts \
                  apps/api/src/index.ts
          git commit -m "chore: auto-publish type packages [skip ci]" || true
          # main moves during a run: rebase the bump commit onto it, retry twice.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
