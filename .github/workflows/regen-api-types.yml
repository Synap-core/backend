name: Regenerate API types on main

# Self-heal for packages/api-types/src/generated.d.ts. Two PRs that each
# regenerated it can merge text-cleanly into a file the generator would not
# produce for the combined source (each PR was fresh against its own base).
# gen-types:check then goes red on main and on every PR merged with it. This
# job regenerates on main and, only if the file drifted, commits it back.
#
# No loop: a push made with GITHUB_TOKEN starts no workflow run (GitHub rule),
# and the job also skips its own commit by the marker in the message. The
# flip side of that rule: the bot commit gets no CI run of its own; the next
# merge to main runs CI over it.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

# A newer push regenerates from a newer main: only the latest run matters.
concurrency:
  group: regen-api-types
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regen:
    name: Regenerate generated.d.ts
    if: ${{ !contains(github.event.head_commit.message, '[regen-api-types]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the push step may rebase onto a main that moved.
          fetch-depth: 0
          # No token in .git/config while dependencies install and build: only
          # the final push is given one.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"

      # Version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # pnpm 10 no longer ships node-gyp, and node-pty (apps/api, in
      # onlyBuiltDependencies) compiles from source on linux.
      - name: Install node-gyp
        run: npm install -g node-gyp@11.5.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Strict (no `|| true`): the generator reads the dependencies' built
      # declarations, and a half-built tree could emit a degraded file that
      # this job would then commit to main.
      - name: Build @synap/api and its workspace dependencies
        run: pnpm turbo run build --filter=@synap/api
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # --check: a generation failure fails the job instead of keeping the
      # committed file and reporting "no drift".
      - name: Regenerate
        working-directory: packages/api
        run: node scripts/gen-types.mjs --check

      - name: Commit the regenerated file if it drifted
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          F=packages/api-types/src/generated.d.ts
          if git diff --quiet -- "$F"; then
            echo "generated.d.ts is current: nothing to do"
            exit 0
          fi
          git diff --stat -- "$F"
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$F"
          # The commit-msg hook (commitlint, body lines <= 100) runs here too:
          # a longer line fails the commit and main keeps a stale file.
          git commit -m "chore(api-types): regenerate generated.d.ts after merge [regen-api-types]" \
            -m "Regenerated from ${GITHUB_SHA}" \
            -m "by .github/workflows/regen-api-types.yml: the merged file differed from" \
            -m "what the generator produces for the merged source."
          git_auth() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" "$@"; }
          # main may move while this runs. A move that also changed the file
          # (rebase conflict) or the source (its push started a newer run,
          # which cancels this one) is left to that newer run.
          for attempt in 1 2 3; do
            git_auth push origin "HEAD:refs/heads/main" && exit 0
            git_auth fetch -q origin main
            git rebase --autostash origin/main || { git rebase --abort; echo "::warning::main changed generated.d.ts meanwhile; leaving it to the newer run"; exit 0; }
            sleep 5
          done
          echo "::error::could not push the regenerated generated.d.ts to main"
          exit 1
