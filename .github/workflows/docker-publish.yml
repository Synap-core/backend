name: Publish Docker Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
    paths:
      - "packages/**"
      - "apps/**"
      - "deploy/**"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

# Branch → image tag mapping:
#   develop  → :dev  (staging ring — no CP notification)
#   main     → :main + :sha-* (production ring — notifies CP)
#   v*       → :vX.Y.Z + :latest (release — notifies CP)

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-backend-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "full=${REPO_OWNER}/${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.full }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  notify-control-plane:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-backend-api
    # Only notify CP on main branch and version tags — not on develop
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Compute image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="main-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Notify Control Plane
        run: |
          PAYLOAD=$(jq -n \
            --arg tag "${{ steps.tag.outputs.tag }}" \
            --arg gitSha "${{ github.sha }}" \
            --arg gitRef "${{ github.ref }}" \
            '{tag: $tag, gitSha: $gitSha, gitRef: $gitRef}')

          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.CP_WEBHOOK_SECRET }}" | awk '{print $2}')

          curl -sf -X POST \
            "${{ secrets.CONTROL_PLANE_API_URL }}/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" \
            --max-time 30 || echo "Warning: Control Plane notification failed (non-fatal)"
