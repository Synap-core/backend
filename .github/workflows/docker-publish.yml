name: Publish Docker Images

on:
  # ON DEMAND ONLY (founder, 2026-10-18): images and releases are built when a
  # release is wanted, never on every green push. Two doors, both gated on a
  # green CI run for the exact commit (job ci-gate below):
  #   - a v* tag  → STABLE release vX.Y.Z (what managed and lab pods install)
  #   - "Run workflow" on main (gh workflow run docker-publish.yml --ref main)
  #               → FAST release main-<sha7>
  # The old `workflow_run: CI completed` trigger built a fast release (and asked
  # for a production approval) after every merge.
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Branch → image tag mapping (update-door plan P1 — pods never consume :latest):
#   develop  → :dev + :develop-<sha7> + :sha-<full>  (staging ring — no release, no CP notification)
#   main     → :main + :main-<sha7> + :sha-<full>     (FAST channel release main-<sha7>)
#   v*       → :vX.Y.Z + :X.Y                         (STABLE channel release vX.Y.Z)
# Each main/v* run publishes a release manifest (job publish-release): images
# by DIGEST + migration level + compose sha + deploy bundle. `synap update
# --release <id|fast|stable>` consumes it; nothing pulls a mutable tag.

# Least privilege by default; each job grants only what it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # A release is only ever built from a commit CI has passed. A tag or a manual
  # run is not itself covered by CI, so this checks the CI history of the SHA.
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::CI has not passed on $SHA. Push it to main (CI runs on every push) and wait for green, then release."
            exit 1
          fi
          echo "CI passed on $SHA ($n green run(s))."

  build-and-push-backend-api:
    needs: ci-gate
    runs-on: ubuntu-latest
    # Only run if CI passed (workflow_run), or if triggered by tag push / manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    # D16: a production build (main via CI, or a v* tag) waits for the
    # `production` environment's required reviewer; develop builds do not use
    # an environment at all (empty name = none). publish-release and
    # notify-control-plane `needs` these jobs, so one approval gates the release.
    environment: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || (github.event_name != 'workflow_run' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) && 'production' || '' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      resolved_ref: ${{ steps.resolve.outputs.ref }}
      resolved_sha: ${{ steps.resolve.outputs.sha }}
      digest: ${{ steps.push.outputs.digest }}

    services:
      postgres:
        image: timescale/timescaledb-ha:pg15
        env:
          POSTGRES_USER: synap
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: synap
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Resolve ref and sha
        id: resolve
        # Event data goes through env, never interpolated into the script
        # (a branch name is attacker-controlled text).
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            REF="refs/heads/${RUN_HEAD_BRANCH}"
            SHA="${RUN_HEAD_SHA}"
          else
            REF="${GH_REF}"
            SHA="${GH_SHA}"
          fi
          {
            echo "ref=${REF}"
            echo "sha=${SHA}"
            echo "sha7=${SHA:0:7}"
            echo "branch=${REF#refs/heads/}"
            echo "tag=${REF#refs/tags/}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "full=${REPO_OWNER}/${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.full }}
          tags: |
            type=raw,value=dev,enable=${{ steps.resolve.outputs.ref == 'refs/heads/develop' }}
            type=raw,value=main,enable=${{ steps.resolve.outputs.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.resolve.outputs.branch }}-${{ steps.resolve.outputs.sha7 }},enable=${{ startsWith(steps.resolve.outputs.ref, 'refs/heads/') }}
            type=raw,value=sha-${{ steps.resolve.outputs.sha }},enable=${{ startsWith(steps.resolve.outputs.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Backend image (local)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: false
          load: true
          tags: synap-backend:smoke-test
          build-args: GIT_SHA=${{ steps.resolve.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Run migrations against smoke-test DB
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=postgresql://synap:testpass@localhost:5432/synap \
            --entrypoint sh \
            synap-backend:smoke-test \
            -c "cd /app/api && test -f node_modules/@synap/database/dist/scripts/migrate.js && node node_modules/@synap/database/dist/scripts/migrate.js"

      - name: Smoke test — verify container starts
        run: |
          docker run -d --name smoke-test \
            --network host \
            -e DATABASE_URL=postgresql://synap:testpass@localhost:5432/synap \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e SKIP_SECRET_VALIDATION=true \
            -e ALLOWED_ORIGINS=http://localhost:3000 \
            -e KRATOS_PUBLIC_URL=http://localhost:9999 \
            -e KRATOS_ADMIN_URL=http://localhost:9999 \
            -e MINIO_ACCESS_KEY_ID=smoke-test \
            -e MINIO_SECRET_ACCESS_KEY=smoke-test-secret \
            synap-backend:smoke-test

          # Wait up to 30s for health check
          for i in $(seq 1 6); do
            sleep 5
            if curl -sf http://localhost:4000/health; then
              echo "Smoke test passed!"
              docker rm -f smoke-test
              exit 0
            fi
            echo "Attempt $i/6..."
          done

          echo "SMOKE TEST FAILED — container logs:"
          docker logs smoke-test
          docker rm -f smoke-test
          exit 1

      - name: Push Backend image to GHCR
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./deploy/Dockerfile
          # Stamps SYNAP_GIT_SHA → /status/release buildStamp; `synap update`
          # refuses a release whose running image does not report its gitSha.
          build-args: GIT_SHA=${{ steps.resolve.outputs.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  build-and-push-pod-agent:
    needs: ci-gate
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    # D16: a production build (main via CI, or a v* tag) waits for the
    # `production` environment's required reviewer; develop builds do not use
    # an environment at all (empty name = none). publish-release and
    # notify-control-plane `needs` these jobs, so one approval gates the release.
    environment: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || (github.event_name != 'workflow_run' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) && 'production' || '' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Resolve ref and sha
        id: resolve
        # Event data goes through env, never interpolated into the script
        # (a branch name is attacker-controlled text).
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            REF="refs/heads/${RUN_HEAD_BRANCH}"
            SHA="${RUN_HEAD_SHA}"
          else
            REF="${GH_REF}"
            SHA="${GH_SHA}"
          fi
          {
            echo "ref=${REF}"
            echo "sha=${SHA}"
            echo "sha7=${SHA:0:7}"
            echo "branch=${REF#refs/heads/}"
            echo "tag=${REF#refs/tags/}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "full=${REPO_OWNER}/${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "owner=${REPO_OWNER}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/pod-agent
          tags: |
            type=raw,value=dev,enable=${{ steps.resolve.outputs.ref == 'refs/heads/develop' }}
            type=raw,value=main,enable=${{ steps.resolve.outputs.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.resolve.outputs.branch }}-${{ steps.resolve.outputs.sha7 }},enable=${{ startsWith(steps.resolve.outputs.ref, 'refs/heads/') }}
            type=raw,value=sha-${{ steps.resolve.outputs.sha }},enable=${{ startsWith(steps.resolve.outputs.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push pod-agent image
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./deploy/pod-agent
          file: ./deploy/pod-agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # pod-admin was never published (update-door plan §1 #16): every pod built it
  # on the host. It is a generic image (POD_PUBLIC_URL is runtime env, nothing
  # NEXT_PUBLIC_* is baked), so one artifact serves every pod.
  build-and-push-pod-admin:
    needs: ci-gate
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    # D16: a production build (main via CI, or a v* tag) waits for the
    # `production` environment's required reviewer; develop builds do not use
    # an environment at all (empty name = none). publish-release and
    # notify-control-plane `needs` these jobs, so one approval gates the release.
    environment: ${{ ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') || (github.event_name != 'workflow_run' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))) && 'production' || '' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Resolve ref and sha
        id: resolve
        # Event data goes through env, never interpolated into the script
        # (a branch name is attacker-controlled text).
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            REF="refs/heads/${RUN_HEAD_BRANCH}"
            SHA="${RUN_HEAD_SHA}"
          else
            REF="${GH_REF}"
            SHA="${GH_SHA}"
          fi
          {
            echo "ref=${REF}"
            echo "sha=${SHA}"
            echo "sha7=${SHA:0:7}"
            echo "branch=${REF#refs/heads/}"
            echo "tag=${REF#refs/tags/}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "full=${REPO_OWNER}/${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "owner=${REPO_OWNER}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/pod-admin
          tags: |
            type=raw,value=dev,enable=${{ steps.resolve.outputs.ref == 'refs/heads/develop' }}
            type=raw,value=main,enable=${{ steps.resolve.outputs.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.resolve.outputs.branch }}-${{ steps.resolve.outputs.sha7 }},enable=${{ startsWith(steps.resolve.outputs.ref, 'refs/heads/') }}
            type=raw,value=sha-${{ steps.resolve.outputs.sha }},enable=${{ startsWith(steps.resolve.outputs.ref, 'refs/heads/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push pod-admin image
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./apps/pod-admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ── Release manifest (update-door plan P1) ─────────────────────────────────
  # One immutable release per green main commit (channel fast, id main-<sha7>)
  # and per v* tag (channel stable, id vX.Y.Z). Published as GitHub Release
  # assets: the pod side needs only curl + jq (no OCI client), the repo and
  # GHCR images are public, and the manifest's own payload is content-addressed
  # (image digests, bundle sha256). Channel pointers are the fixed releases
  # channel-fast / channel-stable whose release.json is replaced (--clobber)
  # AFTER the release itself exists, so a pointer never names a missing release.
  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-backend-api
      - build-and-push-pod-agent
      - build-and-push-pod-admin
    if: >
      needs.build-and-push-backend-api.outputs.resolved_ref == 'refs/heads/main' ||
      startsWith(needs.build-and-push-backend-api.outputs.resolved_ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
      # D12: keyless cosign — the OIDC token is the signing identity.
      id-token: write
    outputs:
      release_id: ${{ steps.id.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build-and-push-backend-api.outputs.resolved_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Release id + channel
        id: id
        env:
          REF: ${{ needs.build-and-push-backend-api.outputs.resolved_ref }}
          SHA: ${{ needs.build-and-push-backend-api.outputs.resolved_sha }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "id=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"; echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "id=main-${SHA:0:7}" >> "$GITHUB_OUTPUT"; echo "channel=fast" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy bundle (synap + deploy files of this commit)
        run: |
          git archive --format=tar.gz -o "synap-deploy-${{ steps.id.outputs.id }}.tar.gz" HEAD \
            synap deploy kratos docker/postgres ':(exclude)deploy/__tests__'

      - name: Build release.json (third-party images resolved to digests)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          python3 deploy/release/make-manifest.py \
            --id "${{ steps.id.outputs.id }}" --channel "${{ steps.id.outputs.channel }}" \
            --git-sha "${{ needs.build-and-push-backend-api.outputs.resolved_sha }}" \
            --image "SYNAP_IMAGE_BACKEND=ghcr.io/${OWNER}/backend@${{ needs.build-and-push-backend-api.outputs.digest }}" \
            --image "SYNAP_IMAGE_POD_ADMIN=ghcr.io/${OWNER}/pod-admin@${{ needs.build-and-push-pod-admin.outputs.digest }}" \
            --image "SYNAP_IMAGE_POD_AGENT=ghcr.io/${OWNER}/pod-agent@${{ needs.build-and-push-pod-agent.outputs.digest }}" \
            --bundle "synap-deploy-${{ steps.id.outputs.id }}.tar.gz" > release.json
          cat release.json

      - name: Validate release.json with the engine's own rules
        run: bash deploy/release/validate-manifest.sh release.json

      - name: Every image digest resolves in its registry
        run: |
          for ref in $(jq -r '.images[]' release.json); do
            docker buildx imagetools inspect "$ref" >/dev/null || { echo "::error::$ref does not resolve"; exit 1; }
          done

      # D12: sign the manifest — it is the root of trust (images by digest and
      # the bundle sha256 live inside it). Keyless: Fulcio certifies this
      # workflow's identity (…/docker-publish.yml@refs/heads/main for a fast
      # release — workflow_run always runs the default-branch file — or
      # @refs/tags/vX.Y.Z for a stable one) and Rekor logs it. `synap update`
      # verifies with the same identity + issuer (_ue_verify_manifest_sig).
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "v2.5.3"

      - name: Sign release.json (keyless)
        run: |
          cosign sign-blob --yes \
            --bundle release.json.sigstore.json \
            --output-signature release.json.sig \
            --output-certificate release.json.pem \
            release.json

      - name: Publish the release, then move the channel pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ steps.id.outputs.id }}
          CHANNEL: ${{ steps.id.outputs.channel }}
          SHA: ${{ needs.build-and-push-backend-api.outputs.resolved_sha }}
        run: |
          # install.sh + the cloud-init template ride on every release AND on the
          # channel pointer: the CP fetches <base>/<channel-stable|id>/pod-user-data.yaml.tmpl
          # and the template fetches <dir>/install.sh.
          INSTALLER_ASSETS=(install.sh deploy/cloud-init/pod-user-data.yaml.tmpl)
          # The signature rides next to release.json, on the release AND the pointer.
          SIG_ASSETS=(release.json.sigstore.json release.json.sig release.json.pem)
          ASSETS=(release.json "${SIG_ASSETS[@]}" "synap-deploy-${ID}.tar.gz" "${INSTALLER_ASSETS[@]}")
          if gh release view "$ID" >/dev/null 2>&1; then
            gh release upload "$ID" "${ASSETS[@]}" --clobber
          elif [ "$CHANNEL" = stable ]; then
            gh release create "$ID" "${ASSETS[@]}" --verify-tag --title "$ID" --notes "Pod release $ID (stable). Apply: synap update --release $ID"
          else
            gh release create "$ID" "${ASSETS[@]}" --target "$SHA" --prerelease --latest=false \
              --title "$ID" --notes "Pod release $ID (fast channel, commit $SHA). Apply: synap update --release $ID"
          fi
          POINTER="channel-${CHANNEL}"
          gh release view "$POINTER" >/dev/null 2>&1 || gh release create "$POINTER" --target "$SHA" --prerelease --latest=false \
            --title "$POINTER" --notes "Channel pointer: release.json here is the latest $CHANNEL release. Apply: synap update --release $CHANNEL"
          gh release upload "$POINTER" release.json "${SIG_ASSETS[@]}" "${INSTALLER_ASSETS[@]}" --clobber

  notify-control-plane:
    runs-on: ubuntu-latest
    # The CP's tag is the release id (main-<sha7> / vX.Y.Z), so it is only sent
    # once that release's manifest is published — pod-agent's update-pod.sh
    # hands it straight to `synap update --release`.
    needs:
      - build-and-push-backend-api
      - publish-release

    steps:
      - name: Compute image tag
        id: tag
        run: |
          echo "tag=${{ needs.publish-release.outputs.release_id }}" >> $GITHUB_OUTPUT

      - name: Notify Control Plane
        env:
          CP_URL: ${{ secrets.CONTROL_PLANE_API_URL }}
          CP_SECRET: ${{ secrets.CP_WEBHOOK_SECRET }}
          RESOLVED_SHA: ${{ needs.build-and-push-backend-api.outputs.resolved_sha }}
          RESOLVED_REF: ${{ needs.build-and-push-backend-api.outputs.resolved_ref }}
        run: |
          # A MISSING SECRET IS A CONFIG ERROR AND MUST FAIL LOUDLY.
          # Both were unset here too: the curl posted to a bare path with an
          # empty HMAC key and the step went green anyway, because it ends in
          # `|| echo "...(non-fatal)"`. No imageReleases row is ever recorded and
          # no pod on `auto_latest` is ever told to update.
          # A network blip staying non-fatal is fine. Absent config is not.
          MISSING=""
          [ -z "$CP_URL" ]    && MISSING="$MISSING CONTROL_PLANE_API_URL"
          [ -z "$CP_SECRET" ] && MISSING="$MISSING CP_WEBHOOK_SECRET"
          if [ -n "$MISSING" ]; then
            echo "::error::Control Plane notification is not configured. Missing secret(s):$MISSING"
            exit 1
          fi
          PAYLOAD=$(jq -n \
            --arg tag "${{ steps.tag.outputs.tag }}" \
            --arg gitSha "$RESOLVED_SHA" \
            --arg gitRef "$RESOLVED_REF" \
            '{tag: $tag, gitSha: $gitSha, gitRef: $gitRef}')

          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$CP_SECRET" | awk '{print $2}')

          # The CP's ANSWER is config too: 404 = wrong CONTROL_PLANE_API_URL,
          # 503 = CP has no GITHUB_WEBHOOK_SECRET, 401 = that secret differs
          # from CP_WEBHOOK_SECRET here. Each means no image_releases row is
          # written, so an HTTP error fails the job (curl exit 22). Only a
          # transport failure (DNS, connect, timeout) stays a warning.
          set +e
          curl -sS --fail-with-body -X POST \
            "$CP_URL/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "$PAYLOAD" \
            --max-time 30
          RC=$?
          set -e
          echo
          if [ "$RC" -eq 22 ]; then
            echo "::error::Control Plane rejected the release notification (HTTP error above). No image_releases row was recorded."
            exit 1
          elif [ "$RC" -ne 0 ]; then
            echo "::warning::Control Plane notification failed in transport (curl exit $RC, non-fatal). Register it by hand: POST /admin/updates/releases {\"tag\":\"${{ steps.tag.outputs.tag }}\"}"
          fi
