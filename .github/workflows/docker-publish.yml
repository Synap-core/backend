name: Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      # Only build if relevant files changed (saves CI minutes)
      - "packages/**"
      - "apps/**"
      - "deploy/**"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
  # Builds automatically on:
  # - Every push to main (if relevant files changed)
  # - Version tags (v*)
  # - Manual dispatch
  # Images are tagged with: latest, main, sha-{commit}, and version tags

env:
  REGISTRY: ghcr.io
  # Convert repository names to lowercase (required for Docker registry)
  # Format: owner/repo-name (lowercase)
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/${{ github.event.repository.name }}
  IMAGE_NAME_INTELLIGENCE: ${{ github.repository_owner }}/intelligence-service

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for OIDC authentication with GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # Note: If you get "permission_denied: write_package", check:
          # 1. Organization settings: https://github.com/organizations/synap-core/settings/packages
          # 2. Repository Actions settings: https://github.com/synap-core/backend/settings/actions
          # 3. Package might need to be created first: https://github.com/orgs/synap-core/packages
          # See: .github/workflows/FIX_GHCR_PERMISSIONS.md

      - name: Convert repository name to lowercase
        id: repo
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${REPO_OWNER}" >> $GITHUB_OUTPUT
          echo "name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "full=${REPO_OWNER}/${REPO_NAME}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.full }}
          tags: |
            # Always tag with commit SHA for traceability
            type=sha,prefix={{branch}}-
            # Tag main branch as 'latest' and 'main'
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # Version tags (semver)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # PR and branch tags (for testing)
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  build-and-push-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for OIDC authentication with GHCR

    steps:
      - name: Checkout intelligence service
        uses: actions/checkout@v4
        with:
          repository: synap-labs/synap-intelligence-service
          path: intelligence-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # Note: If you get "permission_denied: write_package", check:
          # 1. Organization settings: https://github.com/organizations/synap-core/settings/packages
          # 2. Repository Actions settings: https://github.com/synap-core/backend/settings/actions
          # 3. Package might need to be created first: https://github.com/orgs/synap-core/packages
          # See: .github/workflows/FIX_GHCR_PERMISSIONS.md

      - name: Convert intelligence repo name to lowercase
        id: intel-repo
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${REPO_OWNER}" >> $GITHUB_OUTPUT
          echo "full=${REPO_OWNER}/intelligence-service" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.intel-repo.outputs.full }}
          tags: |
            # Always tag with commit SHA for traceability
            type=sha,prefix={{branch}}-
            # Tag main branch as 'latest' and 'main'
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # Version tags (semver)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # PR and branch tags (for testing)
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Intelligence Service image
        uses: docker/build-push-action@v5
        with:
          context: ./intelligence-service
          file: ./intelligence-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
