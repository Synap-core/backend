name: Merge bot

# The backend merge bot (founder, 2026-10-29). It ENQUEUES a PR into the merge
# queue once it is green and eligible, puts a main-red fix at the FRONT of the
# queue, and gives the PRs that went red only because main was red ONE fresh
# CI run once main is green again. It never merges, never bypasses, never
# pushes, never updates a branch. Rules, and why a plain re-run would not do:
# scripts/ci/merge-bot.mjs; tripwire: scripts/ci/merge-bot.tripwire.test.ts.
#
# Identity: a write made with this job's GITHUB_TOKEN starts no workflow run,
# so an enqueue with it would queue a PR whose merge_group checks never start.
# The writes use the "Synap Merge Bot" GitHub App (contents + pull requests
# write, installed on backend only, never on the ruleset's bypass list), from
# the secrets SYNAP_MERGE_BOT_APP_ID / SYNAP_MERGE_BOT_KEY. They live ONLY in
# environment `ci-bots`, whose deployment branch policy is main: a workflow on
# any other branch cannot read them (a repo secret could be read by any
# branch's workflow). Without them the bot judges and logs, writes nothing,
# and the run stays green (fail-safe).
#
# workflow_run and schedule run the DEFAULT BRANCH's copy of this file and of
# the scripts; the job never checks out or runs a PR's code. A change here
# takes effect once it is on main (try it first with "Run workflow", dry run).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # A merge-queue run (head branch gh-readonly-queue/main/pr-<n>-<sha>)
    # makes no PR eligible. Filtered here, it starts no run at all: a run the
    # job's `if` skipped still took the one pending slot of the concurrency
    # group below and replaced a real pending pass (29 Oct, 6 queue builds at
    # once: two live sweeps lost to skipped runs within one minute).
    branches-ignore:
      - "gh-readonly-queue/**"
  # Every landing re-judges every PR: a PR whose Depends-On just landed, and
  # main's red-window victims once main is green. GitHub's `schedule` is
  # best effort: it fired 0 times from 16:35 to 20:00Z on 29 Oct, so a PR
  # whose own CI had finished before its dependency landed was never judged.
  push:
    branches: [main]
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Judge and log only; enqueue nothing, run nothing again
        type: boolean
        default: true

permissions: {}

concurrency:
  # ONE group: two passes never run at once, so a PR is never enqueued twice
  # and a victim never run twice. A newer pending pass replaces an older one;
  # a PR's own pass lost that way is judged by the next sweep (<= 15 min).
  group: merge-bot
  cancel-in-progress: false

jobs:
  bot:
    name: Enqueue green PRs, run main's victims again
    # A merge-queue run's completion makes no PR eligible: skip it.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The bot app's secrets are in this environment only (branch policy: main).
    # workflow_run and schedule run on main, so they get them; the tripwire
    # fails if this line goes.
    environment: ci-bots
    permissions:
      # Reads: PRs, check runs, workflow runs. checks: write = the once-only
      # "Re-run after main green" marker. Every write that must START CI goes
      # through the app token below, not this one.
      contents: read
      pull-requests: read
      actions: read
      checks: write
    env:
      MERGE_BOT_CONFIGURED: ${{ secrets.SYNAP_MERGE_BOT_APP_ID != '' && secrets.SYNAP_MERGE_BOT_KEY != '' }}
    steps:
      # The default branch's scripts only.
      - name: Checkout the bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci/merge-bot.mjs
            scripts/ci/release-gate-wait.mjs
            scripts/layout/hold.mjs
            scripts/layout/layout.mjs
            scripts/layout/layout.json
            scripts/pod-observation.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A Depends-On target may live in a PRIVATE repo: the read-only Reader
      # App reads it (as in depends-on.yml). Without it such a dependency reads
      # as "could not read", is held, and the PR is not enqueued.
      - name: Mint the private-repo read token (Reader App)
        id: reader-token
        if: ${{ vars.SYNAP_READER_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          private-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          owner: Synap-core
          repositories: |
            control-plane-api
            app-bases
          permission-contents: read

      # The writer: the Synap Merge Bot app, on backend only, with only what an
      # enqueue and a draft/ready toggle need. A failed mint leaves the token
      # empty, and the bot then writes nothing (fail-safe).
      - name: Mint the merge bot token (Synap Merge Bot app)
        id: bot-token
        if: ${{ env.MERGE_BOT_CONFIGURED == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.SYNAP_MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.SYNAP_MERGE_BOT_KEY }}
          owner: Synap-core
          repositories: backend
          permission-contents: write
          permission-pull-requests: write

      - name: Enqueue green PRs, run main's victims again
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_BOT_TOKEN: ${{ steps.bot-token.outputs.token }}
          LAYOUT_TOKEN: ${{ steps.reader-token.outputs.token }}
          MERGE_BOT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/ci/merge-bot.mjs
