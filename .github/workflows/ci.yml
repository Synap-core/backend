name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is automatically detected from package.json "packageManager" field

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        # Allow up to 100 warnings (errors will still fail)
        run: pnpm lint --max-warnings=100
        continue-on-error: false

      - name: Format Check
        # Format check is non-blocking (warnings only)
        run: pnpm format || echo "⚠️  Format check failed - run 'pnpm format:fix' to auto-fix"
        continue-on-error: true

      - name: Check orphaned REST route files
        run: node packages/api/src/routers/hub-protocol/rest/check-orphan-routes.mjs
        continue-on-error: false

      - name: Build workspace dependencies
        # Build workspace packages first so TypeScript can resolve types during typecheck
        # TypeScript project references require built .d.ts files
        run: |
          echo "🔨 Building workspace dependencies..."
          pnpm turbo build \
            --filter='@synap-core/core' \
            --filter='@synap-core/types' \
            --filter='@synap/storage' \
            --filter='@synap-core/hub-protocol' \
            --filter='@synap/database' \
            --filter='@synap/api' \
            --filter='@synap/jobs' \
            --filter='@synap/auth' \
            --filter='@synap/events' \
            || echo "⚠️  Some builds may have failed, continuing..."

      - name: Typecheck
        run: pnpm typecheck

      # Fail the PR if the generated API-types contract is stale (router changed
      # but @synap-core/api-types/generated.d.ts wasn't regenerated). The
      # frontends consume this artifact, so drift is a silent type-safety hole.
      - name: Verify generated API types are up to date
        run: pnpm --filter @synap/api gen-types:check

      # gen-types:check above only proves the COMMITTED generated.d.ts is
      # fresh — it says nothing about whether that surface ever reached the
      # PUBLISHED npm tarball, or whether synap-app's pinned range still
      # resolves it. See check-publish-freshness.mjs's header for the full
      # rationale. Network-degrades to a warning (never fails on a transient
      # registry/GitHub blip) — only a genuine version/range drift fails.
      - name: Check @synap-core/api-types publish freshness (drift tripwire)
        run: node scripts/check-publish-freshness.mjs
        working-directory: packages/api-types
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Start API server for smoke tests
        run: |
          # Start server in background with test config
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/synap_test \
          NODE_ENV=test \
          PORT=4000 \
          SKIP_SECRET_VALIDATION=true \
          node apps/api/dist/index.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Wait for server to be healthy (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              break
            fi
            sleep 1
          done
        continue-on-error: true

      - name: Smoke test
        run: |
          if [ -f scripts/smoke-test.sh ]; then
            chmod +x scripts/smoke-test.sh
            BASE_URL=http://localhost:4000 bash scripts/smoke-test.sh || echo "Smoke tests failed (non-blocking)"
          fi
        continue-on-error: true
        env:
          BASE_URL: http://localhost:4000

      - name: Validate migrations
        run: pnpm --filter @synap/database migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test

      - name: Test
        # Skip @synap-core/core tests (they require @synap/database which creates circular dependency)
        # Other package tests should still run
        run: pnpm test --filter='!@synap-core/core'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test
          NODE_ENV: test

      - name: Build
        run: pnpm build

      - name: Validate smoke test script
        run: |
          if [ -f scripts/smoke-test.sh ]; then
            bash -n scripts/smoke-test.sh && echo "✓ smoke-test.sh syntax valid"
          else
            echo "⚠️  scripts/smoke-test.sh not found"
          fi
        continue-on-error: true

      - name: Test Docker Build
        run: |
          docker build -t synap-backend:test -f deploy/Dockerfile .
          docker run --rm synap-backend:test node --version
          docker rmi synap-backend:test

      - name: Security Audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
