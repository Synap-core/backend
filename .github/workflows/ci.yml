name: CI

on:
  pull_request:
    # No `branches:` filter: a PR whose base is not main/develop (a stack) used
    # to get no CI at all and could merge into its base unchecked (#372). It
    # now gets the Release gate; the suites hold red until it targets main.
    # ready_for_review: a draft runs the Release gate only (see `changes`); the
    # suites start when it is marked ready. Until then "Full suite" and "API
    # e2e" report red ("suites not run: draft"), never a skip that reads green.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue tests each PR once against the real next main.
  merge_group:
  push:
    # release/** : a release is cut from a branch (a verified main commit plus
    # chosen fixes) and tagged; CI must gate THAT exact commit. A pull_request
    # run would test the branch merged into today's main instead.
    branches: ["main", "develop", "release/**"]

# A pull request keeps only its newest run (cancel-in-progress). A push to
# main, develop or a release branch never cancels a RUNNING run: with
# cancel-in-progress off, GitHub keeps the running one and only the NEWEST
# waiting one per branch, so every run that starts finishes and the latest main
# is always measured. (26 Oct, cancel-in-progress on: no main run finished
# between 08:44 and 18:00. 27 Oct, one group per commit: 14 full main runs
# queued behind each other after a merge wave, ahead of every PR.) A merge
# queue entry gets a group per commit: each one must report.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: jobs that need more declare it themselves.
permissions:
  contents: read

# TWO JOBS (founder decision 2026-10-19, release gating option A):
#   release-gate — what must hold for a commit to be RELEASED: it installs,
#                  lints, typechecks, builds, migrates a real Postgres, boots,
#                  and builds the image. Since 2026-10-29 its work runs in four
#                  parallel "Release gate: <part>" jobs and the job named
#                  "Release gate" judges them (see the release-gate block below).
#   full-suite   — the test suites, the floor, the tripwires, the audit.
# Since 2026-10-29 ("One trunk, three CI tiers") a release needs BOTH, and API
# e2e and Reference docs too: docker-publish.yml's ci-gate takes only a commit
# whose post-merge run (event push) had all 4 required checks `success`
# (scripts/ci/release-gate-wait.mjs). Until then it read "Release gate" alone
# and a red Full suite was a backlog, not a release blocker.
# They run in parallel and set up through ONE composite action
# (.github/actions/monorepo-setup) so they can never set up differently; its
# turbo cache replays the build of every package whose inputs did not change.

# WHAT RUNS (2026-10-27, pod document "Backend CI: where the 2 hours per PR
# go"): the `changes` job reads what a pull request touched and turns off what
# it cannot affect — a draft runs no suites, a negctl/* branch runs only its own
# test files ("Targeted tests"), a docs-only change runs nothing, and the Docker
# build + deploy tests run only when a path the image is made of changed
# (IMAGE_INPUTS; always on a push to main, and before every release).
# THREE TIERS (founder, 2026-10-29, "One trunk, three CI tiers"): a pull
# request runs the tests of what it can break (the touched packages, their
# workspace dependents, the tests that read them by path, every tripwire;
# the full suite when shared or core code changed) and API e2e only when the
# API surface changed (scripts/ci/affected.mjs). Push to main and release
# branches always run everything; a pod updates only to a main commit whose
# post-merge run was all green (docker-publish.yml, ci-gate). A merge queue
# entry runs the Release gate and takes the Full suite + API e2e from its PR's
# own run when both concluded `success` there (founder 2026-10-28, "light
# queue run", #428); otherwise it runs the tier of what it changes on top of
# the main it lands on, on the combined tree. Every required check RUNS on a PR or
# a queue entry: one whose work is not needed passes through a "Not affected"
# step that names why, never through a skip. An entry whose TREE is the tree
# its PR's run tested, with all 4 required checks `success` on that run,
# re-runs nothing (`reuse`, scripts/ci-changes.mjs "SAME TREE"). FAIL-SAFE:
# every job also runs when `changes` itself fails (`needs.changes.result !=
# 'success'`), and a job skipped by its `if:` reports success to the required
# check, so a skip must only ever come from a positive decision.
# The Full suite runs as 4 shard jobs and one judge job named "Full suite"
# (the required check); see scripts/test-ratchet-shards.mjs.

# PREFLIGHT FIRST (2026-10-28, pod document "Fast verdicts"): one merge took
# ~4 h, five runs of 22-34 min in a row, each finding ONE red that a 1-second
# check would have found (an api-types hand publish, a stale door tool-name
# table). The "Preflight" job runs those checks (scripts/preflight.mjs, every
# red at once, ~1 min with setup) and the heavy jobs wait for it. A red
# preflight on a pull request or the merge queue (`hold`) skips the heavy WORK,
# never a required check: "Release gate", "Full suite", "API e2e" and
# "Reference docs are current" each still run and fail at their first step
# ("Preflight red"), because a job skipped by its `if:` reports success. A push
# to main or a release branch is never held: main is always measured whole.
# FAIL-SAFE: a preflight job that crashed (not red) holds nothing.

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A merge queue entry reads its PR's head, that head's check runs, and the
    # jobs of the PR run it may reuse (actions: read).
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      gate: ${{ steps.decide.outputs.gate }}
      image: ${{ steps.decide.outputs.image }}
      image_reason: ${{ steps.decide.outputs.image_reason }}
      suites: ${{ steps.decide.outputs.suites }}
      scope: ${{ steps.decide.outputs.scope }}
      affected: ${{ steps.decide.outputs.affected }}
      also: ${{ steps.decide.outputs.also }}
      e2e: ${{ steps.decide.outputs.e2e }}
      reason: ${{ steps.decide.outputs.reason }}
      negctl: ${{ steps.decide.outputs.negctl }}
      negctl_tests: ${{ steps.decide.outputs.negctl_tests }}
      hold: ${{ steps.decide.outputs.hold }}
      dependents: ${{ steps.decide.outputs.dependents }}
      reuse: ${{ steps.decide.outputs.reuse }}
    steps:
      # The commit this run tests (for a pull request, GitHub's test merge),
      # in a step NAME: the jobs API returns step names, so a merge-queue
      # entry can compare its tree with the tree this run tested and reuse an
      # all-green verdict (scripts/ci-changes.mjs, "SAME TREE").
      - name: Tested commit ${{ github.sha }}
        run: echo "this run tests ${{ github.sha }}"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git diff base...head` needs the merge base.
          fetch-depth: 0

      - name: Decide which checks this change needs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-changes.mjs

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # main-status reads the latest main CI run.
      actions: read
    outputs:
      red: ${{ steps.run.outputs.red }}
      reds: ${{ steps.run.outputs.reds }}
      # true: the heavy jobs skip their work and their required checks fail.
      hold: ${{ steps.run.outputs.red == 'true' && github.event_name != 'push' && 'true' || 'false' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      # `pnpm audit` (security-audit) needs pnpm, not an install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # control-plane-api (door-tool-names) and app-bases (api-types
      # freshness) are private: the Reader App's read token, as monorepo-setup.
      - name: Mint control-plane-api read token (GitHub App)
        id: app-token
        if: ${{ vars.SYNAP_READER_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          private-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          owner: Synap-core
          repositories: |
            control-plane-api
            app-bases
          permission-contents: read

      # Tier 0: no install, no build. Never exits 1 on a red; writes red/reds.
      - name: Preflight checks (scripts/preflight.mjs --tier=0)
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          CP_READ_TOKEN: ${{ steps.app-token.outputs.token || secrets.CROSS_REPO_TOKEN }}
          CROSS_REPO_TOKEN: ${{ steps.app-token.outputs.token || secrets.CROSS_REPO_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/preflight.mjs --ci --tier=0

      - name: Fail on a red check
        if: ${{ steps.run.outputs.red == 'true' }}
        env:
          REDS: ${{ steps.run.outputs.reds }}
        run: |
          echo "::error::Preflight red: $REDS. Reproduce with 'pnpm preflight'; the step summary has each fix."
          exit 1

  # THE RELEASE GATE (2026-10-29, lane cispeed): four jobs in parallel and
  # one judge named "Release gate", the required check that docker-publish.yml
  # (scripts/ci/release-gate-wait.mjs) and the merge queue
  # (scripts/ci-changes.mjs QUEUE_REUSE_CHECKS) read by that exact name.
  # Until then it was ONE sequential job: 23.5 min on a run that changed CI
  # files (run 40786725416: setup 3, lint 2.5, format 1.5, deploy tests 4.8,
  # typecheck 2.3, gen-types 1.1, build 1.6, Docker 5.7), 8.5 min otherwise.
  #   Release gate: lint                    conformance, lint, format, orphan
  #                                         routes (install, no build, no db)
  #   Release gate: typecheck, build, boot  typecheck, gen-types:check,
  #                                         migrate, schema, build, boot,
  #                                         smoke, schema hash (Postgres)
  #   Release gate: deploy tests            deploy/__tests__ + pod-agent (no
  #                                         install); "Not affected" unless
  #                                         an IMAGE_INPUTS path changed
  #   Release gate: Docker image            build + image smoke (no install);
  #                                         "Not affected" unless an
  #                                         IMAGE_INPUTS path changed
  #   Release gate (judge)                  fails unless every sub-job it needs
  #                                         succeeded (scripts/ci/release-gate-judge.mjs)
  # Every step of the old job is in exactly one sub-job, under its old name
  # (scripts/ci/check-scores.mjs folds "Release gate: <part>" back into the
  # "Release gate" unit, so its rows stay comparable).
  gate-lint:
    name: "Release gate: lint"
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.outputs.hold != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.gate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The layout (ci/scripts/check.mjs scans the sibling repos' workflows)
      # and the install. eslint here is not type-aware: no dist needed.
      - name: Monorepo layout + dependencies
        uses: ./.github/actions/monorepo-setup
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          app-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}
          build: "false"

      # CI/CD CONFORMANCE GATE. Every publish workflow across ALL repos must
      # satisfy the shared rules in ci/repos.yml (no dual pnpm pin, id-token:
      # write on real npm publish jobs, publish concurrency that never cancels,
      # no NPM_TOKEN auth var, no cross-repo package-name collision, a changeset
      # ignore list covering every public package). The scan set is DERIVED and
      # both scans assert non-vacuity. See ci/README.md.
      - name: CI/CD conformance gate
        # check.mjs resolves `yaml` from the workspace root (two levels up),
        # which in CI is the runner's work dir with no node_modules. pnpm's
        # hidden hoist dir holds yaml (a transitive dep).
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules/.pnpm/node_modules
        run: node ci/scripts/check.mjs --quiet

      - name: Lint
        # Allow up to 100 warnings (errors will still fail). The ledger-path
        # check first: an allowlisted path that no longer exists silently
        # exempts nothing (see scripts/check-eslint-ledger-paths.mjs).
        run: |
          node scripts/check-eslint-ledger-paths.mjs
          pnpm lint --max-warnings=100

      - name: Format Check
        # Format check is non-blocking (warnings only)
        run: pnpm format || echo "⚠️  Format check failed - run 'pnpm format:fix' to auto-fix"
        continue-on-error: true

      - name: Check orphaned REST route files
        run: node packages/api/src/routers/hub-protocol/rest/check-orphan-routes.mjs

  gate-build:
    name: "Release gate: typecheck, build, boot"
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.outputs.hold != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.gate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cross-repo layout (../synap-control-plane-api, ../synap-app), Node,
      # pnpm, install, and the workspace-dependency build through the turbo
      # cache. A push to main builds from an EMPTY turbo cache: the entry it
      # saves below then holds exactly that commit's tasks, and PR runs start
      # from it.
      - name: Monorepo layout + dependencies
        id: setup
        uses: ./.github/actions/monorepo-setup
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          app-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}
          restore-turbo-cache: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'false' || 'true' }}

      # @synap/api's `tsc --noEmit` outgrew Node's default heap on the hosted
      # runner (2026-10-23: "JavaScript heap out of memory", exit 134, on main
      # and on PRs). ubuntu-latest has 16 GB; 6 GB for tsc leaves room.
      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Fail if the generated API-types contract is stale (router changed but
      # @synap-core/api-types/generated.d.ts wasn't regenerated). The frontends
      # consume this artifact, so drift is a silent type-safety hole. The file
      # stays COMMITTED: synap-app, browser and relay read it from a backend
      # checkout that never builds @synap/api. In the merge queue this checks
      # the PR merged with the next main, so a combined file the generator
      # would not produce never lands; nothing regenerates it after a merge.
      # Fix when red: the hint the check prints (scripts/gen-types.mjs).
      - name: Verify generated API types are up to date
        run: pnpm --filter @synap/api gen-types:check

      - name: Validate migrations
        run: pnpm --filter @synap/database migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test

      # validateSchemaCoherence() (packages/database/src/utils/schema-coherence.ts)
      # against the live, just-migrated DB: catches migration drift in CI, not
      # at pod boot.
      - name: Schema coherence check
        run: pnpm --filter @synap/database schema:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test

      - name: Build
        run: pnpm build

      # The built API boots against the migrated CI Postgres and answers. Until
      # 2026-10-19 both steps were continue-on-error and the server had in fact
      # exited at boot (no KRATOS_PUBLIC_URL) on every run, unnoticed. Ory is
      # never called by these probes; the URL only satisfies the boot check.
      - name: Start API server for smoke tests
        run: |
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/synap_test \
          NODE_ENV=test \
          PORT=4000 \
          SKIP_SECRET_VALIDATION=true \
          KRATOS_PUBLIC_URL=http://localhost:4433 \
          KRATOS_ADMIN_URL=http://localhost:4434 \
          node apps/api/dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API server not healthy after 60s"
          tail -n 80 "$RUNNER_TEMP/api.log"
          exit 1

      - name: Smoke test
        run: |
          bash -n scripts/smoke-test.sh
          bash scripts/smoke-test.sh || { tail -n 80 "$RUNNER_TEMP/api.log"; exit 1; }
        env:
          BASE_URL: http://localhost:4000

      # The booted bundle serves the hash of the committed generated.d.ts: the
      # hash is baked in by tsup's `define`, never read from a committed file.
      # gen-types:check above proved the file current, so this is the contract
      # the pod really implements.
      - name: Health serves the derived schema hash
        run: |
          want=$(node --input-type=module -e 'import { schemaHashOfFile } from "./packages/api/scripts/schema-hash.mjs"; console.log(schemaHashOfFile())')
          got=$(curl -sf http://localhost:4000/api/hub/health | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).schemaHash))')
          echo "generated.d.ts: $want  /api/hub/health: $got"
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "::error::/api/hub/health schemaHash ($got) is not the hash of packages/api-types/src/generated.d.ts ($want)"; exit 1; }

      # The turbo cache this job built (every package's build and typecheck),
      # for the next runs of this ref and, from main, of every PR. Only after
      # a green build: turbo caches only tasks that succeeded anyway. Not from
      # a merge-queue entry, whose ref is deleted once it merges.
      - name: Save the turbo cache
        if: ${{ success() && github.event_name != 'merge_group' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}

  # Deploy safety tripwires (daemon-free). pgdata-safety guards the
  # THE IMAGE JOBS (founder, 2026-10-29, decision ffaafe15: "image checks
  # move to the nightly"). The deploy tests and the Docker image run on every
  # push to main (and develop, release/**), and on a pull request or a queue
  # entry only when it touches what the image or the deploy tests are made of
  # (scripts/ci-changes.mjs IMAGE_INPUTS: Dockerfile*, deploy/**, the
  # lockfile and manifests, packages/database/**, skills/, the skill runner,
  # ...). Every release runs them again before it is built
  # (docker-publish.yml release-checks and build-and-push-backend-api). Until
  # then every PR touching anything but application source paid ~10 min of
  # runner for them. Whenever the gate runs these two jobs RUN: when the
  # change does not need them they pass through their "Not affected" step,
  # which names why in the run's summary, and the judge requires `success`
  # from every sub-job (a skipped sub-job is red, #441).
  #
  # 2026-10-02 pod wipe: postgres data must live on its volume, every update
  # door must run the placement guard first, and backups must land on the
  # host. They guard what a release DOES to a pod, so they gate releases.
  # bash, python3 and node only: no install, no layout.
  gate-deploy:
    name: "Release gate: deploy tests"
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.outputs.hold != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.gate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The image work runs (or `changes` failed, and then everything runs).
      RUN_WORK: ${{ needs.changes.result != 'success' || needs.changes.outputs.image != 'false' }}
    steps:
      - name: Not affected (nothing the deploy tests read changed)
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.image == 'false' && needs.preflight.outputs.hold != 'true' }}
        env:
          REASON: ${{ needs.changes.outputs.image_reason }}
        run: |
          echo "Deploy tests not run: $REASON"
          printf '### Release gate: deploy tests not affected\n\n%s.\n\nDecided by "What changed" (scripts/ci-changes.mjs IMAGE_INPUTS).\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Repository
        if: ${{ env.RUN_WORK == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: ${{ env.RUN_WORK == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Deploy safety tests
        if: ${{ env.RUN_WORK == 'true' }}
        run: bash scripts/ci/deploy-tests.sh

  # The image smoke (scripts/ci/image-smoke.sh): in the BUILT image the
  # code-skill sandbox's native addon runs an isolate, the CMD carries
  # --no-node-snapshot, and the skill runner's sandbox holds. The image is
  # built from a clean checkout, as docker-publish.yml builds it.
  gate-image:
    name: "Release gate: Docker image"
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.outputs.hold != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.gate == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The image work runs (or `changes` failed, and then everything runs).
      RUN_WORK: ${{ needs.changes.result != 'success' || needs.changes.outputs.image != 'false' }}
    steps:
      - name: Not affected (nothing the image is made of changed)
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.image == 'false' && needs.preflight.outputs.hold != 'true' }}
        env:
          REASON: ${{ needs.changes.outputs.image_reason }}
        run: |
          echo "Docker image not built: $REASON"
          printf '### Release gate: Docker image not affected\n\n%s.\n\nDecided by "What changed" (scripts/ci-changes.mjs IMAGE_INPUTS).\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Repository
        if: ${{ env.RUN_WORK == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Docker Build
        if: ${{ env.RUN_WORK == 'true' }}
        run: |
          docker build -t synap-backend:test -f deploy/Dockerfile .
          bash scripts/ci/image-smoke.sh synap-backend:test
          docker rmi synap-backend:test

  # The judge: the ONE check named "Release gate". It runs whenever the gate
  # is due (same condition as the single job had) and fails unless every
  # sub-job it needs ended `success` (the image jobs too: when the change
  # does not need them they succeed through their "Not affected" step). A
  # sub-job that failed, was cancelled (a timeout), or was skipped is red
  # here (scripts/ci/release-gate-judge.mjs reads `needs`
  # whole, so a sub-job added to `needs:` is required by existing).
  # `!cancelled()`, not `always()`: a superseded (cancelled) run then starts
  # no runner just to report red, and its "Release gate" is not a success
  # either way (cancelled or never created), so it cannot merge or release.
  # NEVER SKIPPED (2026-10-29, three CI tiers): when this run does not need
  # the gate (docs only, a same-tree queue entry), the job still runs and
  # passes through its "Not affected" step, which names the decision in the
  # run's summary. A job skipped by its `if:` would pass the required check
  # silently (#441: skipped never counts as passed).
  release-gate:
    name: Release gate
    needs: [changes, preflight, gate-lint, gate-build, gate-deploy, gate-image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The gate's work ran (or `changes` failed, and then everything ran).
      RUN_WORK: ${{ needs.changes.result != 'success' || needs.changes.outputs.gate != 'false' }}
    steps:
      # A negctl/* branch never merges. The Release gate is a required check,
      # and a job skipped by its `if:` reports success, so a negctl PR to main
      # could merge on a green skip. It reports red instead. See ci-changes.mjs.
      - name: Never merges (negctl)
        if: ${{ needs.changes.outputs.hold == 'negctl' }}
        run: |
          echo "::error::A negctl/* branch never merges: this required check reports red on purpose. Run the negative control inside the devbox job (NEG_REF) and open no PR."
          exit 1

      # A red preflight: this required check FAILS without doing the work (a
      # job skipped by its `if:` would report success). See the header.
      - name: Preflight red (${{ needs.preflight.outputs.reds }})
        if: ${{ needs.preflight.outputs.hold == 'true' }}
        run: |
          echo "::error::Preflight is red (${{ needs.preflight.outputs.reds }}): this check did not run its work. Open the Preflight job for each red and its fix, or run 'pnpm preflight'."
          exit 1

      # An explicit, logged pass: only a successful `changes` that decided
      # gate=false (docs only, a same-tree queue entry) reaches it.
      - name: Not affected (the Release gate's work did not need to run)
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.gate == 'false' && needs.changes.outputs.hold == '' && needs.preflight.outputs.hold != 'true' }}
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "Release gate not run: $REASON"
          printf '### Release gate: not affected\n\n%s.\n\nDecided by "What changed" (scripts/ci-changes.mjs); its summary lists what this run checks.\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the judge
        if: ${{ env.RUN_WORK == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/release-gate-judge.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Every Release gate job succeeded
        if: ${{ env.RUN_WORK == 'true' }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/release-gate-judge.mjs

  # The Full suite: 4 shard jobs run the tests, one judge job ("Full suite", the
  # required check) reads their reports and applies the ratchet once. Measured
  # 2026-10-27: one job took 65 min, of which packages/api (1,950 files) was
  # ~38 min of critical path; split 4 ways it is ~10 min per shard. Since
  # 2026-10-28 every packages/api file and every other package has a shard from
  # a committed plan balanced by measured time (scripts/ci/shard-plan.json; see
  # scripts/test-ratchet-shards.mjs); the root tripwires run in shard 1.
  full-suite-shard:
    name: Full suite (shard ${{ matrix.shard }}/4)
    needs: [changes, preflight]
    if: ${{ !cancelled() && needs.preflight.outputs.hold != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.suites == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Monorepo layout + dependencies
        id: setup
        uses: ./.github/actions/monorepo-setup
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          app-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}

      # The suites below read the migrated schema.
      - name: Migrate the test database
        run: pnpm --filter @synap/database migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test

      # This shard's part of ONE run of every suite (read
      # scripts/test-ratchet.mjs's header for what the ratchet judges). A shard
      # judges nothing: it writes its vitest JSON reports, the judge job below
      # reads all four. @synap-core/core's `test` script is an echo stub
      # (circular dependency on @synap/database); the ratchet lists it as not run.
      # The PR tier (scope=affected): only the affected packages' suites, the
      # test files of other packages that read them, and every tripwire
      # (scripts/ci/affected.mjs). Empty = everything (a push to main, a
      # shared-code change, or `changes` failed).
      - name: Test (shard ${{ matrix.shard }}/4)
        timeout-minutes: 45
        run: node scripts/test-ratchet.mjs --shard=${{ matrix.shard }}/4
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test
          NODE_ENV: test
          TEST_RATCHET_CONCURRENCY: "2"
          TEST_RATCHET_SCOPE: ${{ needs.changes.outputs.scope }}
          TEST_RATCHET_AFFECTED: ${{ needs.changes.outputs.scope == 'affected' && needs.changes.outputs.affected || '' }}
          TEST_RATCHET_ALSO: ${{ needs.changes.outputs.scope == 'affected' && needs.changes.outputs.also || '' }}

      - name: Security Audit
        if: ${{ !cancelled() && matrix.shard == 1 }}
        timeout-minutes: 5
        run: pnpm audit --prod --audit-level=high

      # gen-types:check (release gate) only proves the COMMITTED generated.d.ts
      # is fresh — not that the surface reached the PUBLISHED npm tarball, or
      # that synap-app's pinned range resolves it. See
      # check-publish-freshness.mjs's header. Network-degrades to a warning;
      # only a genuine version/range drift fails.
      - name: Check @synap-core/api-types publish freshness (drift tripwire)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        timeout-minutes: 5
        run: node scripts/check-publish-freshness.mjs
        working-directory: packages/api-types
        env:
          # Reads synap-app's package.json (Synap-core/app-bases).
          SYNAP_APP_REPO: Synap-core/app-bases
          CROSS_REPO_TOKEN: ${{ steps.setup.outputs.token }}

      - name: Upload this shard's reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-shard-${{ matrix.shard }}
          path: coverage/test-ratchet/
          retention-days: 7

  # NEVER SKIPPED (2026-10-29, three CI tiers): a run whose tier runs no suite
  # (docs only, a same-tree queue entry) passes through the "Not affected"
  # step, which names the decision in the run's summary.
  full-suite:
    name: Full suite
    needs: [changes, preflight, full-suite-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_WORK: ${{ needs.changes.result != 'success' || needs.changes.outputs.suites != 'false' }}
    steps:
      # A draft: this required check FAILS instead of being skipped, because
      # GitHub counts a job skipped by its `if:` as passed ("A job that is
      # skipped will report its status as Success. It will not prevent a pull
      # request from merging, even if it is a required check."). backend#382
      # and #394 merged on a draft run's skipped suites. See ci-changes.mjs.
      - name: Suites not run (${{ needs.changes.outputs.hold }})
        if: ${{ needs.changes.outputs.hold != '' }}
        env:
          HOLD: ${{ needs.changes.outputs.hold }}
        run: |
          case "$HOLD" in
            negctl) echo "::error::A negctl/* branch never merges: this required check reports red on purpose. Its own tests ran in 'Targeted tests'. Close the PR and delete the branch; better, run the negative control inside the devbox job (NEG_REF) and open no PR." ;;
            stacked) echo "::error::Suites not run: this PR's base is not main. Retarget it to main (then push, or 'gh pr ready --undo <n>' and 'gh pr ready <n>') to run them." ;;
            *) echo "::error::Suites not run: this run is for a draft. Mark the PR ready to run them. Already ready? A draft run superseded the ready run: run 'gh pr ready --undo <n>' then 'gh pr ready <n>', or push." ;;
          esac
          exit 1

      # A red preflight: this required check FAILS without doing the work (a
      # job skipped by its `if:` would report success). See the header.
      - name: Preflight red (${{ needs.preflight.outputs.reds }})
        if: ${{ needs.preflight.outputs.hold == 'true' }}
        run: |
          echo "::error::Preflight is red (${{ needs.preflight.outputs.reds }}): this check did not run its work. Open the Preflight job for each red and its fix, or run 'pnpm preflight'."
          exit 1

      # An explicit, logged pass: only a successful `changes` that decided
      # suites=false with no hold reaches it.
      - name: Not affected (no test suite needed to run)
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.suites == 'false' && needs.changes.outputs.hold == '' && needs.preflight.outputs.hold != 'true' }}
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "Full suite not run: $REASON"
          printf '### Full suite: not affected\n\n%s.\n\nDecided by "What changed" (scripts/ci-changes.mjs); its summary lists what this run checks.\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"

      # The ratchet's judge reads the workspace's package.json files, the
      # baseline and the tripwire files: a checkout, no install.
      - name: Checkout Repository
        if: ${{ env.RUN_WORK == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.RUN_WORK == 'true' }}
        with:
          node-version-file: ".node-version"

      - name: Collect the shards' reports
        if: ${{ env.RUN_WORK == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ratchet-shard-*
          path: ${{ runner.temp }}/ratchet
          merge-multiple: true

      # A missing shard report is `no-report` (red), never a partial green.
      # Judged with the shards' own scope (the same two outputs).
      - name: Test ratchet (all shards, against the known-red baseline)
        if: ${{ env.RUN_WORK == 'true' }}
        run: node scripts/test-ratchet.mjs --reports="$RUNNER_TEMP/ratchet" --shards=4
        env:
          TEST_RATCHET_SCOPE: ${{ needs.changes.outputs.scope }}
          TEST_RATCHET_AFFECTED: ${{ needs.changes.outputs.scope == 'affected' && needs.changes.outputs.affected || '' }}
          TEST_RATCHET_ALSO: ${{ needs.changes.outputs.scope == 'affected' && needs.changes.outputs.also || '' }}

      # A shard can also fail outside its reports (setup, the audit, the
      # publish-freshness tripwire): that fails the Full suite too.
      - name: Every shard job succeeded
        if: ${{ !cancelled() && env.RUN_WORK == 'true' && needs.changes.outputs.hold == '' && needs.preflight.outputs.hold != 'true' }}
        run: |
          [ "${{ needs.full-suite-shard.result }}" = "success" ] || {
            echo "::error::a Full suite shard job ended '${{ needs.full-suite-shard.result }}' — open the shard jobs for the failing step"
            exit 1
          }

  # docs/reference/ holds the MCP tool reference, the event catalog and the Hub
  # REST OpenAPI spec, generated from source by scripts/docs/gen-reference.ts.
  # The public doc site consumes them, so a tool, event or route changed without
  # regenerating would publish a wrong reference. This job regenerates in memory
  # and fails when a committed file differs. It runs for EVERY change (docs-only
  # too), except a same-tree merge-queue entry: the OpenAPI spec and the tool list are read from the
  # imported API, which depends on most of packages/. Until 2026-10-28 it was
  # its own workflow (reference-docs.yml); it moved here to wait for Preflight.
  # Fix when red: build the workspace dependencies (step below), then
  #   pnpm docs:reference
  # and commit docs/reference/.
  reference-docs:
    name: Reference docs are current
    needs: [changes, preflight]
    # NEVER SKIPPED (2026-10-29): a merge-queue entry that reuses its PR's
    # all-green run on the same tree (`reuse`) passes through the "Reused"
    # step, which names the reused run; a failed `changes` leaves reuse empty:
    # the work runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_WORK: ${{ needs.changes.outputs.reuse != 'true' }}
    steps:
      # A negctl/* branch never merges and runs only its own tests. This
      # required check reports red for it instead of being skipped: a job
      # skipped by its `if:` reports success, so a negctl PR to main could
      # merge on a green skip.
      - name: Never merges (negctl)
        if: ${{ startsWith(github.head_ref, 'negctl/') }}
        run: |
          echo "::error::A negctl/* branch never merges: this required check reports red on purpose."
          exit 1

      # A red preflight: this required check FAILS without doing the work (a
      # job skipped by its `if:` would report success). See the header.
      - name: Preflight red (${{ needs.preflight.outputs.reds }})
        if: ${{ needs.preflight.outputs.hold == 'true' }}
        run: |
          echo "::error::Preflight is red (${{ needs.preflight.outputs.reds }}): this check did not run its work. Open the Preflight job for each red and its fix, or run 'pnpm preflight'."
          exit 1

      # An explicit, logged pass: only a same-tree queue entry reaches it.
      - name: Reused (same tree as the PR's all-green run)
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.reuse == 'true' && needs.preflight.outputs.hold != 'true' }}
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "Reference docs not re-run: $REASON"
          printf '### Reference docs are current: reused\n\n%s.\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.RUN_WORK == 'true' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ env.RUN_WORK == 'true' }}
        with:
          node-version-file: ".node-version"

      # No `version:`: the repo pins pnpm through `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ env.RUN_WORK == 'true' }}

      # `--ignore-scripts`: the generator only imports TypeScript and builds
      # the workspace packages below; no native addon or git hook is needed.
      - name: Install dependencies
        if: ${{ env.RUN_WORK == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The API resolves its workspace dependencies through their dist/ entry
      # points, so build exactly those (pnpm orders them topologically).
      - name: Build the API's workspace dependencies
        if: ${{ env.RUN_WORK == 'true' }}
        run: pnpm -r --filter "@synap/api^..." run build

      - name: Check docs/reference is up to date
        if: ${{ env.RUN_WORK == 'true' }}
        run: pnpm docs:reference:check

  # A negctl/* branch exists to watch a test go RED with its fix reverted. It
  # runs only its own test files (changed in the branch, or beside a changed
  # source file), not the 65-min suite. Not a required check: negctl PRs never
  # merge. Expected result: red.
  targeted-tests:
    name: Targeted tests
    needs: changes
    if: ${{ needs.changes.outputs.negctl == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Monorepo layout + dependencies
        uses: ./.github/actions/monorepo-setup
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          app-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Migrate the test database
        run: pnpm --filter @synap/database migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test

      - name: Run the branch's test files
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test
          NODE_ENV: test
          FILES: ${{ needs.changes.outputs.negctl_tests }}
        run: |
          [ -n "$FILES" ] || { echo "::error::this negctl branch changes no test file and no source file with a test beside it: nothing to run"; exit 1; }
          failed=""
          # One vitest run per owning package, under that package's config.
          for dir in $(for f in $FILES; do echo "$f" | grep -oE '^(packages|apps)/[^/]+' || echo .; done | sort -u); do
            # `|| true`: for any package dir the loop's last test is false, and
            # under `bash -e` that failed substitution ended the step before vitest.
            rel=$(for f in $FILES; do case "$f" in "$dir"/*) echo "${f#"$dir"/}";; esac; [ "$dir" = . ] && ! echo "$f" | grep -qE '^(packages|apps)/' && echo "$f"; done) || true
            echo "::group::$dir: $rel"
            (cd "$dir" && npx vitest run $rel) || failed="$failed $dir"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::red in:$failed (expected for a negative control)"; exit 1; }

  # The @synap/test-e2e suites drive a RUNNING API over HTTP (127.0.0.1:4000,
  # NODE_ENV=test, which accepts the suites' mock session cookies; Kratos is
  # never called). Full suite boots no server, so they ran there with nothing to
  # talk to and failed at setup ("API server not responding"). This job boots the
  # built API against a migrated Postgres, exactly as the release gate's smoke
  # step does, and judges the e2e files against the same baseline
  # (scripts/test-ratchet-baseline.txt, entries under packages/test-e2e/).
  api-e2e:
    name: API e2e
    needs: [changes, preflight]
    # NEVER SKIPPED (2026-10-29, three CI tiers): a PR whose change does not
    # touch the API surface (scripts/ci/affected.mjs API_SURFACE) passes
    # through the "Not affected" step, which names the decision in the run's
    # summary. Main runs the e2e suite on every push.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_WORK: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false' }}

    # A draft, a preflight hold or a not-affected run starts no service ("If
    # jobs.<job_id>.services.<service_id>.image is assigned an empty string,
    # the service will not start."): its one step ends the job at once. The
    # services context cannot read `env`, so the condition is RUN_WORK's.
    services:
      postgres:
        image: ${{ needs.changes.outputs.hold == '' && needs.preflight.outputs.hold != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') && 'timescale/timescaledb-ha:pg16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # Search: the image and version the pod compose runs
      # (deploy/docker-compose.yml). A service container takes no command line,
      # so the server is configured through its TYPESENSE_* environment.
      typesense:
        image: ${{ needs.changes.outputs.hold == '' && needs.preflight.outputs.hold != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') && 'typesense/typesense:0.25.2' || '' }}
        env:
          TYPESENSE_DATA_DIR: /tmp
          TYPESENSE_API_KEY: ci-typesense
        ports:
          - 8108:8108

    steps:
      # A draft: this required check FAILS instead of being skipped, because
      # GitHub counts a job skipped by its `if:` as passed ("A job that is
      # skipped will report its status as Success. It will not prevent a pull
      # request from merging, even if it is a required check."). backend#382
      # and #394 merged on a draft run's skipped suites. See ci-changes.mjs.
      - name: Suites not run (${{ needs.changes.outputs.hold }})
        if: ${{ needs.changes.outputs.hold != '' }}
        env:
          HOLD: ${{ needs.changes.outputs.hold }}
        run: |
          case "$HOLD" in
            negctl) echo "::error::A negctl/* branch never merges: this required check reports red on purpose. Its own tests ran in 'Targeted tests'. Close the PR and delete the branch; better, run the negative control inside the devbox job (NEG_REF) and open no PR." ;;
            stacked) echo "::error::Suites not run: this PR's base is not main. Retarget it to main (then push, or 'gh pr ready --undo <n>' and 'gh pr ready <n>') to run them." ;;
            *) echo "::error::Suites not run: this run is for a draft. Mark the PR ready to run them. Already ready? A draft run superseded the ready run: run 'gh pr ready --undo <n>' then 'gh pr ready <n>', or push." ;;
          esac
          exit 1

      # A red preflight: this required check FAILS without doing the work (a
      # job skipped by its `if:` would report success). See the header.
      - name: Preflight red (${{ needs.preflight.outputs.reds }})
        if: ${{ needs.preflight.outputs.hold == 'true' }}
        run: |
          echo "::error::Preflight is red (${{ needs.preflight.outputs.reds }}): this check did not run its work. Open the Preflight job for each red and its fix, or run 'pnpm preflight'."
          exit 1

      # An explicit, logged pass: only a successful `changes` that decided
      # e2e=false with no hold reaches it.
      - name: Not affected (no API surface path changed)
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.e2e == 'false' && needs.changes.outputs.hold == '' && needs.preflight.outputs.hold != 'true' }}
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "API e2e not run: $REASON"
          printf '### API e2e: not affected\n\n%s.\n\nDecided by "What changed" (scripts/ci-changes.mjs, API_SURFACE in scripts/ci/affected.mjs); main runs the e2e suite after the merge.\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Repository
        if: ${{ env.RUN_WORK == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Monorepo layout + dependencies
        if: ${{ env.RUN_WORK == 'true' }}
        uses: ./.github/actions/monorepo-setup
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          app-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Migrate the test database
        if: ${{ env.RUN_WORK == 'true' }}
        run: pnpm --filter @synap/database migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test

      - name: Build the API
        if: ${{ env.RUN_WORK == 'true' }}
        run: pnpm turbo build --filter=api...

      - name: Start the API (test mode)
        if: ${{ env.RUN_WORK == 'true' }}
        run: |
          # The workers create the search collections at boot, so Typesense
          # must answer before the API starts.
          for i in $(seq 1 60); do
            curl -sf http://localhost:8108/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8108/health || { echo "::error::Typesense not healthy after 60s"; exit 1; }
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/synap_test \
          NODE_ENV=test \
          PORT=4000 \
          SKIP_SECRET_VALIDATION=true \
          KRATOS_PUBLIC_URL=http://localhost:4433 \
          KRATOS_ADMIN_URL=http://localhost:4434 \
          STORAGE_PROVIDER=local \
          LOCAL_STORAGE_DIR="$RUNNER_TEMP/storage" \
          TYPESENSE_HOST=localhost \
          TYPESENSE_PORT=8108 \
          TYPESENSE_PROTOCOL=http \
          TYPESENSE_API_KEY=ci-typesense \
          TYPESENSE_ADMIN_API_KEY=ci-typesense \
          node apps/api/dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API server not healthy after 60s"
          tail -n 80 "$RUNNER_TEMP/api.log"
          exit 1

      - name: E2E (ratchet against the known-red baseline)
        if: ${{ env.RUN_WORK == 'true' }}
        timeout-minutes: 20
        run: node scripts/test-ratchet.mjs --script=test:e2e --only=packages/test-e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synap_test
          NODE_ENV: test

      - name: API log
        if: ${{ !cancelled() && env.RUN_WORK == 'true' }}
        run: tail -n 200 "$RUNNER_TEMP/api.log" || true

      - name: Upload e2e reports
        if: ${{ always() && env.RUN_WORK == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: coverage/test-ratchet/
          retention-days: 7

  # ADVISORY (not a required check): backend CI never saw the repos that link this
  # one's shared packages by source, so a types change could break an app repo with
  # every backend check green (#372). When packages/types, api-types or markdown-core
  # change, check out app-bases, browser and relay-app with the Synap Reader App
  # token (read-only; SECURITY-RELEASE-RUNBOOK.md §5.1) and typecheck them against
  # this head. The access step lists which repos the App could read, so a repo it
  # is not installed on shows by name. The three repos are red at main on their own
  # (devbox baseline), so the typechecks report and annotate; they do not fail the
  # job. Only an unreadable repo or a failed install does. NEEDS a baseline compare
  # (errors at the PR's base types vs head) before it can become a required check.
  dependent-repos:
    name: Dependent repos typecheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.dependents == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lays out ../synap-app (app-bases), ../synap-control-plane-api and
      # ../synap-backend, installs and builds this repo.
      - name: Monorepo layout + dependencies
        id: setup
        uses: ./.github/actions/monorepo-setup
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          app-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          cross-repo-token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Mint browser + relay-app read token (GitHub App)
        id: app-token
        if: ${{ vars.SYNAP_READER_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.SYNAP_READER_APP_ID }}
          private-key: ${{ secrets.SYNAP_READER_APP_KEY }}
          owner: Synap-core
          repositories: |
            app-bases
            browser
            relay-app
          permission-contents: read

      - name: Checkout browser
        id: co-browser
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Synap-core/browser
          token: ${{ steps.app-token.outputs.token || secrets.CROSS_REPO_TOKEN }}
          path: .browser-checkout

      - name: Checkout relay-app
        id: co-relay
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Synap-core/relay-app
          token: ${{ steps.app-token.outputs.token || secrets.CROSS_REPO_TOKEN }}
          path: .relay-checkout

      - name: Reader App access to the dependent repos
        env:
          BROWSER: ${{ steps.co-browser.outcome }}
          RELAY: ${{ steps.co-relay.outcome }}
          TOKEN: ${{ steps.app-token.outcome }}
        run: |
          echo "token mint (app-bases, browser, relay-app): $TOKEN"
          echo "app-bases : cloned at $(cd ../synap-app && git rev-parse --short HEAD) (monorepo-setup)"
          if [ -d .browser-checkout/.git ]; then echo "browser   : cloned at $(cd .browser-checkout && git rev-parse --short HEAD)"; else echo "browser   : $BROWSER"; fi
          if [ -d .relay-checkout/.git ]; then echo "relay-app : cloned at $(cd .relay-checkout && git rev-parse --short HEAD)"; else echo "relay-app : $RELAY"; fi
          fail=0
          [ "$BROWSER" = success ] || { echo "::error::The Reader App token cannot read Synap-core/browser. Install the App on it (org settings, GitHub Apps), or set CROSS_REPO_TOKEN."; fail=1; }
          [ "$RELAY" = success ] || { echo "::error::The Reader App token cannot read Synap-core/relay-app. Install the App on it, or set CROSS_REPO_TOKEN."; fail=1; }
          exit $fail

      - name: Lay out the root workspace slice
        run: |
          set -euo pipefail
          P="${GITHUB_WORKSPACE}/.."
          mv .browser-checkout "$P/browser"
          mv .relay-checkout "$P/relay-app"
          cp scripts/ci/dependent-root/package.json scripts/ci/dependent-root/pnpm-workspace.yaml "$P/"
          cp scripts/ci/dependent-root/dot-npmrc "$P/.npmrc"
          ls "$P"

      - name: Install the slice
        working-directory: ..
        run: pnpm install --no-frozen-lockfile --reporter=append-only

      - name: Build the linked backend packages
        working-directory: ..
        run: pnpm --filter @synap-core/types --filter @synap-core/api-types --filter @synap-core/markdown-core run build

      - name: Typecheck app-bases headless
        continue-on-error: true
        working-directory: ..
        run: pnpm --filter @synap-core/headless run type-check

      - name: Typecheck app-bases hooks
        continue-on-error: true
        working-directory: ..
        run: pnpm --filter @synap-core/hooks run type-check

      - name: Typecheck app-bases web
        continue-on-error: true
        working-directory: ..
        run: pnpm --filter @synap-core/web run type-check

      - name: Typecheck browser
        continue-on-error: true
        working-directory: ..
        run: pnpm --filter @synap-core/browser run typecheck

      - name: Typecheck relay-app
        continue-on-error: true
        working-directory: ..
        run: pnpm --filter relay-app run typecheck

  # RED MAIN (2026-10-29, three CI tiers): a PR runs only what it can break,
  # so main's post-merge run is the first to see the whole suite. When a
  # required check of a push run on main is not green, this job writes the
  # commits since the last main commit whose post-merge run was all green to
  # the run's summary, so the ONE owner of the red (.claude/rules/github-ci.md,
  # "one owner per red main") starts from the range. It reverts nothing and is
  # not a required check. `!cancelled()`: a superseded run is not a red.
  red-main:
    name: "Red main: culprit range"
    needs: [release-gate, full-suite, api-e2e, reference-docs]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.release-gate.result != 'success' || needs.full-suite.result != 'success' || needs.api-e2e.result != 'success' || needs.reference-docs.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Checkout main's history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 40
          persist-credentials: false

      - name: Name the commits since the last all-green main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CULPRIT_LIMIT: "30"
        run: node scripts/ci/release-gate-wait.mjs --culprits "$REPO" "$SHA"
