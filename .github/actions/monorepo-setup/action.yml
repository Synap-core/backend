name: Monorepo layout + dependencies
description: >
  Lays out ../synap-control-plane-api and ../synap-app beside this checkout
  (the cross-repo tripwires read them) through the layout resolver
  (scripts/layout/layout.mjs), then sets up Node + pnpm, installs, and builds
  the workspace dependencies through the turbo cache. Shared by every ci.yml
  job that installs, so they can never set up differently. The repository
  itself must already be checked out.

inputs:
  app-id:
    description: vars.SYNAP_READER_APP_ID (may be empty)
    required: false
    default: ""
  app-key:
    description: secrets.SYNAP_READER_APP_KEY
    required: false
    default: ""
  cross-repo-token:
    description: secrets.CROSS_REPO_TOKEN (transition fallback for the Reader App)
    required: false
    default: ""
  build:
    description: >
      "true": build the workspace dependencies (turbo, through the turbo
      cache). "false": install only (a job that lints needs no dist).
    required: false
    default: "true"
  restore-turbo-cache:
    description: >
      "true": restore the newest turbo cache before building. "false": build
      from an empty cache (main's Release gate, so the entry it saves holds
      only that commit's tasks and does not grow run after run).
    required: false
    default: "true"

outputs:
  token:
    description: The read token used for the sibling checkouts
    value: ${{ steps.app-token.outputs.token || inputs.cross-repo-token }}
  turbo-cache-key:
    description: The key a job saves .turbo/cache under (actions/cache/save)
    value: ${{ steps.turbo-key.outputs.key }}

runs:
  using: composite
  steps:
    # control-plane-api and app-bases are PRIVATE, so the sibling checkouts
    # need a read token: the Synap Reader App's (scoped to control-plane-api +
    # app-bases, contents: read), else the CROSS_REPO_TOKEN secret
    # (SECURITY-RELEASE-RUNBOOK.md §4, §5.1).
    - name: Mint control-plane-api read token (GitHub App)
      id: app-token
      if: ${{ inputs.app-id != '' }}
      continue-on-error: true
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-key }}
        owner: Synap-core
        repositories: |
          control-plane-api
          app-bases
        permission-contents: read

    # Runs ONLY when there is no token. The step header echoes its script on
    # every run, so an always-run step printed this error text in every green
    # log too, and readers took it for the cause of red runs (finding 3b354d79).
    - name: Require a control-plane-api read token
      if: ${{ steps.app-token.outputs.token == '' && inputs.cross-repo-token == '' }}
      shell: bash
      run: |
        echo "::error::No token to read Synap-core/control-plane-api. Set the repo variable SYNAP_READER_APP_ID and secret SYNAP_READER_APP_KEY (SECURITY-RELEASE-RUNBOOK.md §5.1), or, until then, the CROSS_REPO_TOKEN secret (a fine-grained PAT with Contents: read on Synap-core/control-plane-api and app-bases: gh secret set CROSS_REPO_TOKEN -R Synap-core/backend)."
        exit 1

    # The siblings beside this checkout, through the ONE layout resolver
    # (scripts/layout/layout.mjs, layout "backend-ci" of layout.json): the CP
    # as ../synap-control-plane-api, the app as ../synap-app, and this checkout
    # reachable as ../synap-backend (a symlink: the runner names it after the
    # repo, `backend`). Each sibling is a shallow checkout of main or, when this
    # PR's body has a `Depends-On:` line for it that has not landed, of that
    # dependency's test ref (GitHub's test merge of the PR, or the commit): the
    # change is tested WITH what it depends on. A merge-queue or main run has no
    # PR body, so every sibling is at main. Plain node before setup-node: the
    # resolver needs no install. The token reaches git as a per-command header,
    # never a remote URL, and is not persisted in the siblings' .git/config.
    - name: Lay out the monorepo beside this checkout
      shell: bash
      env:
        LAYOUT_TOKEN: ${{ steps.app-token.outputs.token || inputs.cross-repo-token }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        node "${GITHUB_WORKSPACE}/scripts/layout/layout.mjs" materialize backend-ci \
          --root "${GITHUB_WORKSPACE}/.." --self-path "${GITHUB_WORKSPACE}" --body-env PR_BODY
        test -f "${GITHUB_WORKSPACE}/../synap-control-plane-api/src/routes/packages.ts"
        test -d "${GITHUB_WORKSPACE}/../synap-app/packages/workspace-templates/src"
        test -f "${GITHUB_WORKSPACE}/../synap-backend/packages/api/package.json"

    # `.node-version` is the one Node pin of this repo (ci/README.md "Version
    # pinning"); deploy/Dockerfile's FROM stays on its minor.
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: ".node-version"

    # Version comes from package.json `packageManager`.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    # pnpm 10 no longer ships node-gyp, and node-pty (apps/api, in
    # onlyBuiltDependencies) compiles from source on linux.
    - name: Install node-gyp
      shell: bash
      run: npm install -g node-gyp@11.5.0

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # TURBO CACHE (2026-10-29, lane cispeed). The build below took ~110 s in
    # EVERY job of a run (7 jobs, measured on run 40786725416: install 9 s,
    # pnpm store restore 9 s, build 109 s). Turbo's local cache
    # (.turbo/cache) is restored from an earlier run, so a package whose
    # inputs did not change is replayed instead of rebuilt.
    # WHY A HIT IS NEVER STALE: turbo replays a task only when the task's
    # own hash matches, and the hash covers every git-tracked file of the
    # package ($TURBO_DEFAULT$ in turbo.json; packages/api leaves out its
    # tests, which its build never reads), the hashes of the packages it
    # depends on, the lockfile entries it resolves, the root tsconfig.json,
    # and the env turbo.json declares. Files a build reads from OUTSIDE its
    # package are declared in that package's turbo.json ($TURBO_ROOT$/...).
    # The actions/cache key only picks WHICH cache directory to start from:
    # an exact key (a re-run of this commit) or, failing that, the newest
    # entry this ref may read (its own PR's, else main's). A cache from
    # another commit is safe for the same reason: turbo checks every task.
    # A miss builds exactly as before. The Node version is in the key:
    # turbo does not hash the node binary.
    - name: Turbo cache key
      id: turbo-key
      if: ${{ inputs.build == 'true' }}
      shell: bash
      env:
        NODE_PIN: ${{ hashFiles('.node-version') }}
      run: |
        echo "prefix=${RUNNER_OS}-turbo-v1-${NODE_PIN}-" >> "$GITHUB_OUTPUT"
        echo "key=${RUNNER_OS}-turbo-v1-${NODE_PIN}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Restore the turbo cache
      if: ${{ inputs.build == 'true' && inputs.restore-turbo-cache == 'true' }}
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo/cache
        key: ${{ steps.turbo-key.outputs.key }}
        restore-keys: |
          ${{ steps.turbo-key.outputs.prefix }}

    # Build workspace packages first so TypeScript can resolve types (project
    # references need built .d.ts files) and tests can import their dist.
    - name: Build workspace dependencies
      if: ${{ inputs.build == 'true' }}
      shell: bash
      run: |
        pnpm turbo build \
          --filter='@synap-core/core' \
          --filter='@synap-core/types' \
          --filter='@synap/storage' \
          --filter='@synap-core/hub-protocol' \
          --filter='@synap/database' \
          --filter='@synap/api' \
          --filter='@synap/jobs' \
          --filter='@synap/auth' \
          --filter='@synap/events' \
          || echo "⚠️  Some builds may have failed, continuing..."

    # skills/<pkg>/SKILL.md is generated (gitignored) by @synap/api's build
    # script, and the api tripwires read it. A turbo cache HIT replays the
    # api's dist without running that script, so it runs here every time
    # (idempotent, well under a second).
    - name: Assemble the skill packages (skills/build.mjs)
      if: ${{ inputs.build == 'true' }}
      shell: bash
      run: node skills/build.mjs
