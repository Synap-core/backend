name: Monorepo layout + dependencies
description: >
  Lays out ../synap-control-plane-api and ../synap-app beside this checkout
  (the cross-repo tripwires read them) through the layout resolver
  (scripts/layout/layout.mjs), then sets up Node + pnpm and installs.
  Shared by ci.yml's release-gate and full-suite jobs so the two can never set
  up differently. The repository itself must already be checked out.

inputs:
  app-id:
    description: vars.SYNAP_READER_APP_ID (may be empty)
    required: false
    default: ""
  app-key:
    description: secrets.SYNAP_READER_APP_KEY
    required: false
    default: ""
  cross-repo-token:
    description: secrets.CROSS_REPO_TOKEN (transition fallback for the Reader App)
    required: false
    default: ""

outputs:
  token:
    description: The read token used for the sibling checkouts
    value: ${{ steps.app-token.outputs.token || inputs.cross-repo-token }}

runs:
  using: composite
  steps:
    # control-plane-api and app-bases are PRIVATE, so the sibling checkouts
    # need a read token: the Synap Reader App's (scoped to control-plane-api +
    # app-bases, contents: read), else the CROSS_REPO_TOKEN secret
    # (SECURITY-RELEASE-RUNBOOK.md §4, §5.1).
    - name: Mint control-plane-api read token (GitHub App)
      id: app-token
      if: ${{ inputs.app-id != '' }}
      continue-on-error: true
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-key }}
        owner: Synap-core
        repositories: |
          control-plane-api
          app-bases
        permission-contents: read

    # Runs ONLY when there is no token. The step header echoes its script on
    # every run, so an always-run step printed this error text in every green
    # log too, and readers took it for the cause of red runs (finding 3b354d79).
    - name: Require a control-plane-api read token
      if: ${{ steps.app-token.outputs.token == '' && inputs.cross-repo-token == '' }}
      shell: bash
      run: |
        echo "::error::No token to read Synap-core/control-plane-api. Set the repo variable SYNAP_READER_APP_ID and secret SYNAP_READER_APP_KEY (SECURITY-RELEASE-RUNBOOK.md §5.1), or, until then, the CROSS_REPO_TOKEN secret (a fine-grained PAT with Contents: read on Synap-core/control-plane-api and app-bases: gh secret set CROSS_REPO_TOKEN -R Synap-core/backend)."
        exit 1

    # The siblings beside this checkout, through the ONE layout resolver
    # (scripts/layout/layout.mjs, layout "backend-ci" of layout.json): the CP
    # as ../synap-control-plane-api, the app as ../synap-app, and this checkout
    # reachable as ../synap-backend (a symlink: the runner names it after the
    # repo, `backend`). Each sibling is a shallow checkout of main or, when this
    # PR's body has a `Depends-On:` line for it that has not landed, of that
    # dependency's test ref (GitHub's test merge of the PR, or the commit): the
    # change is tested WITH what it depends on. A merge-queue or main run has no
    # PR body, so every sibling is at main. Plain node before setup-node: the
    # resolver needs no install. The token reaches git as a per-command header,
    # never a remote URL, and is not persisted in the siblings' .git/config.
    - name: Lay out the monorepo beside this checkout
      shell: bash
      env:
        LAYOUT_TOKEN: ${{ steps.app-token.outputs.token || inputs.cross-repo-token }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        node "${GITHUB_WORKSPACE}/scripts/layout/layout.mjs" materialize backend-ci \
          --root "${GITHUB_WORKSPACE}/.." --self-path "${GITHUB_WORKSPACE}" --body-env PR_BODY
        test -f "${GITHUB_WORKSPACE}/../synap-control-plane-api/src/routes/packages.ts"
        test -d "${GITHUB_WORKSPACE}/../synap-app/packages/workspace-templates/src"
        test -f "${GITHUB_WORKSPACE}/../synap-backend/packages/api/package.json"

    # `.node-version` is the one Node pin of this repo (ci/README.md "Version
    # pinning"); deploy/Dockerfile's FROM stays on its minor.
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: ".node-version"

    # Version comes from package.json `packageManager`.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    # pnpm 10 no longer ships node-gyp, and node-pty (apps/api, in
    # onlyBuiltDependencies) compiles from source on linux.
    - name: Install node-gyp
      shell: bash
      run: npm install -g node-gyp@11.5.0

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Build workspace packages first so TypeScript can resolve types (project
    # references need built .d.ts files) and tests can import their dist.
    - name: Build workspace dependencies
      shell: bash
      run: |
        pnpm turbo build \
          --filter='@synap-core/core' \
          --filter='@synap-core/types' \
          --filter='@synap/storage' \
          --filter='@synap-core/hub-protocol' \
          --filter='@synap/database' \
          --filter='@synap/api' \
          --filter='@synap/jobs' \
          --filter='@synap/auth' \
          --filter='@synap/events' \
          || echo "⚠️  Some builds may have failed, continuing..."
