# Local Development Docker Compose
# Run: docker compose -f docker-compose.local.yml up -d
# Stop: docker compose -f docker-compose.local.yml down

services:
  # ============================================================================
  # POSTGRESQL (Local)
  # ============================================================================
  postgres:
    image: timescale/timescaledb-ha:pg15
    container_name: synap-postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: synap
      POSTGRES_PASSWORD: synap_dev_password
      POSTGRES_DB: synap
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # REDIS (Local)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: synap-redis-local
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # MINIO (Local)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: synap-minio-local
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================================
  # TYPESENSE (Local)
  # ============================================================================
  typesense:
    image: typesense/typesense:0.25.2
    container_name: synap-typesense-local
    ports:
      - "8108:8108"
    command: "--data-dir /data --api-key=typesense-dev-key --enable-cors"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # ORY KRATOS (Local)
  # ============================================================================
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    container_name: synap-kratos-migrate-local
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    environment:
      DSN: postgres://synap:synap_dev_password@postgres:5432/kratos?sslmode=disable
    command: migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    # No profile - migrations run automatically in local dev

  kratos:
    image: oryd/kratos:v1.3.1
    container_name: synap-kratos-local
    ports:
      - "4433:4433"
      - "4434:4434"
    environment:
      DSN: postgres://synap:synap_dev_password@postgres:5432/kratos?sslmode=disable
      SECRETS_COOKIE: dev-cookie-secret-32-chars-long!!
      SECRETS_CIPHER: dev-cipher-secret-32-chars-long!!
      SERVE_PUBLIC_BASE_URL: http://localhost:4433/.ory/kratos/public/
      SERVE_ADMIN_BASE_URL: http://localhost:4434/.ory/kratos/admin/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: http://localhost:3000/auth
      IDENTITY_SCHEMAS_0_ID: default
      IDENTITY_SCHEMAS_0_URL: file:///etc/config/kratos/identity.schema.json
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ../kratos:/etc/config/kratos
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - kratos
      - serve
      - -c
      - /etc/config/kratos/kratos.yml
      - --dev
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:4433/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # ORY HYDRA (Local)
  # ============================================================================
  hydra-migrate:
    image: oryd/hydra:v2.3.0
    container_name: synap-hydra-migrate-local
    environment:
      DSN: postgres://synap:synap_dev_password@postgres:5432/hydra?sslmode=disable
    command: migrate sql up -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    # No profile - migrations run automatically in local dev

  hydra:
    image: oryd/hydra:v2.3.0
    container_name: synap-hydra-local
    ports:
      - "4444:4444"
      - "4445:4445"
    environment:
      DSN: postgres://synap:synap_dev_password@postgres:5432/hydra?sslmode=disable
      URLS_SELF_ISSUER: http://localhost:4444
      URLS_CONSENT: http://localhost:3000/consent
      URLS_LOGIN: http://localhost:3000/auth
      SECRETS_SYSTEM: dev-hydra-secret-32-chars-long!!
    depends_on:
      postgres:
        condition: service_healthy
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://localhost:4445/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  typesense_data:
